/* --- SCORM runtime wrapper (1.2 and 2004) --- */
var S = { api:null, v:null, t0:new Date(), done:false };
function scan(w, name){ var n=0; while(w && n<12){ try{ if(w[name]) return w[name]; }catch(e){} if(w.parent===w) break; w=w.parent; n++; } return null; }
function locate(w){
  var order = C.scorm==="2004" ? [["API_1484_11","2004"],["API","1.2"]] : [["API","1.2"],["API_1484_11","2004"]];
  for(var i=0;i<order.length;i++){ var a=scan(w, order[i][0]); if(a){ S.api=a; S.v=order[i][1]; return true; } }
  return false;
}
try{ if(!locate(window) && window.opener) locate(window.opener); }catch(e){}
function call(fn12, fn04){ var a=[].slice.call(arguments,2); try{ return S.api[S.v==="2004"?fn04:fn12].apply(S.api,a); }catch(e){ return ""; } }
function get(k12,k04){ return S.api ? String(call("LMSGetValue","GetValue", S.v==="2004"?k04:k12) || "") : ""; }
function set(k12,k04,v){ if(S.api) call("LMSSetValue","SetValue", S.v==="2004"?k04:k12, String(v)); }
function commit(){ if(S.api) call("LMSCommit","Commit",""); }
if(S.api) call("LMSInitialize","Initialize","");

function fmtTime(ms){
  var s=Math.max(0,Math.round(ms/1000));
  if(S.v==="2004") return "PT"+s+"S";
  var h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60, p=function(n){ return (n<10?"0":"")+n; };
  return (h<10?"000":h<100?"00":h<1000?"0":"")+h+":"+p(m)+":"+p(x);
}

/* --- learner state --- */
var visited = [], watched = [], checked = [], page = 0, finished = false, lastScore = null;
(function resume(){
  var raw = get("cmi.suspend_data","cmi.suspend_data");
  try{ var d=JSON.parse(raw); if(d){ visited=d.v||[]; watched=d.w||[]; checked=d.k||[]; finished=!!d.f; lastScore=(d.s==null?null:d.s); } }catch(e){}
  var loc = parseInt(get("cmi.core.lesson_location","cmi.location"),10);
  if(!isNaN(loc) && loc>=0 && loc<=C.pages.length) page=loc;
  if(S.v==="1.2"){ var st=get("cmi.core.lesson_status"); if(st===""||st==="not attempted") set("cmi.core.lesson_status","","incomplete"); }
  else if(S.v==="2004"){ var cs=get("","cmi.completion_status"); if(cs===""||cs==="not attempted"||cs==="unknown") set("","cmi.completion_status","incomplete"); }
  commit();
})();

function save(){
  set("cmi.core.lesson_location","cmi.location", page);
  set("cmi.suspend_data","cmi.suspend_data", JSON.stringify({v:visited,w:watched,k:checked,f:finished?1:0,s:lastScore}));
  commit();
}
function markComplete(){
  finished = true;
  if(S.v==="1.2") set("cmi.core.lesson_status","","completed");
  else { set("","cmi.completion_status","completed"); set("","cmi.success_status","passed"); }
  save();
}
function reportScore(pct, passed){
  lastScore = pct;
  set("cmi.core.score.min","cmi.score.min",0);
  set("cmi.core.score.max","cmi.score.max",100);
  set("cmi.core.score.raw","cmi.score.raw",pct);
  if(S.v==="2004") set("","cmi.score.scaled",(pct/100).toFixed(2));
  if(passed){ finished=true; if(S.v==="1.2") set("cmi.core.lesson_status","","passed"); else { set("","cmi.success_status","passed"); set("","cmi.completion_status","completed"); } }
  else { if(S.v==="1.2") set("cmi.core.lesson_status","","failed"); else { set("","cmi.success_status","failed"); set("","cmi.completion_status", C.allowRetry ? "incomplete" : "completed"); } }
  save();
}
function terminate(){
  if(!S.api || S.done) return; S.done=true;
  save();
  set("cmi.core.session_time","cmi.session_time", fmtTime(new Date()-S.t0));
  if(S.v==="1.2") set("cmi.core.exit","", finished?"":"suspend"); else set("","cmi.exit", finished?"normal":"suspend");
  commit();
  call("LMSFinish","Terminate","");
}
window.addEventListener("pagehide", terminate);
window.addEventListener("beforeunload", terminate);

/* --- rendering --- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function inline(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>"); }
function rich(text){
  var out="", blocks=String(text||"").replace(/\r/g,"").split(/\n\s*\n/);
  blocks.forEach(function(b){
    var lines=b.split("\n").filter(function(l){ return l.trim(); }); if(!lines.length) return;
    var buf=[], list=[];
    function flushP(){ if(buf.length){ out+="<p>"+buf.map(inline).join("<br>")+"</p>"; buf=[]; } }
    function flushL(){ if(list.length){ out+="<ul>"+list.map(function(l){ return "<li>"+inline(l)+"</li>"; }).join("")+"</ul>"; list=[]; } }
    lines.forEach(function(l){ var m=l.match(/^\s*[-*•]\s+(.*)$/); if(m){ flushP(); list.push(m[1]); } else { flushL(); buf.push(l.trim()); } });
    flushP(); flushL();
  });
  return out;
}
function videoHTML(v, bi){
  if(!v || !v.src) return "";
  if(v.kind==="embed"){
    if(C.preview) return '<div class="vid"><div class="vph"><strong>'+esc(v.site)+' video</strong><span>Plays here once the course is in Bridge.</span><a href="'+esc(v.url)+'" target="_blank" rel="noopener">Open the video</a></div></div>';
    return '<div class="vid embed"><iframe src="'+esc(v.src)+'" title="'+esc(v.site)+' video" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe></div>';
  }
  var mustWatch = v.required;
  return '<div class="vid"><video id="vid-'+bi+'" controls playsinline preload="metadata"><source src="'+esc(v.src)+'"'+(v.type?' type="'+esc(v.type)+'"':'')+'>Your browser cannot play this video.</video></div>'+
    (mustWatch?'<p class="vnote" id="vnote-'+bi+'">Watch the video to the end to continue.</p>':'');
}
function blockHTML(b, bi){
  if(b.type==="text") return rich(b.body);
  if(b.type==="image") return b.image ? '<img src="'+esc(b.image)+'" alt="'+esc(b.imageAlt||"")+'" class="'+(b.imagePos==="banner"?"banner":"hero")+'">' : "";
  if(b.type==="video") return videoHTML(b.video, bi);
  if(b.type==="quote") return b.text ? '<blockquote class="quote">'+inline(b.text)+(b.cite?'<cite>'+inline(b.cite)+'</cite>':'')+'</blockquote>' : "";
  if(b.type==="keypoint") return b.text ? '<div class="key k-'+esc(b.tone||"brand")+'">'+inline(b.text)+'</div>' : "";
  return "";
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var app=document.getElementById("app");
var TOTAL = C.pages.length + (HAS_QUIZ?1:0);
var quizOrder=null, answers={}, result=null, onCover=false;

function showCover(){
  var D=C.design||{};
  onCover=true;
  var meta=C.pages.length+" page"+(C.pages.length===1?"":"s")+(HAS_QUIZ?" · "+C.quiz.length+"-question quiz, pass mark "+C.passMark+"%":"");
  shell((D.coverImage?'<img class="banner" src="'+esc(D.coverImage)+'" alt="">':'')+
    (D.logo?'<img class="clogo" src="'+esc(D.logo)+'" alt="'+esc(D.logoAlt||"")+'">':'')+
    '<h1>'+esc(C.title)+'</h1>'+
    (C.description?'<p class="desc">'+inline(C.description)+'</p>':'')+
    '<div class="meta">'+meta+(C.author?' · '+esc(C.author):'')+'</div>'+
    '<button class="go" id="start">'+esc(D.coverButton||"Start course")+'</button>', "");
  document.getElementById("start").onclick=function(){ page=0; showPage(); };
}

function shell(inner, foot){
  var pct = Math.round((Math.min(page+1,TOTAL)/TOTAL)*100);
  if(finished && !HAS_QUIZ) pct=100;
  var D=C.design||{};
  var count = onCover ? "" : (page<C.pages.length?'Page '+(page+1)+' of '+C.pages.length:(HAS_QUIZ?'Quiz':''));
  if(onCover) pct=0;
  app.innerHTML =
    '<header><div class="hd"><h1>'+(D.logo?'<img class="logo" src="'+esc(D.logo)+'" alt="'+esc(D.logoAlt||"")+'">':'')+'<span>'+esc(C.title)+'</span></h1><span class="count" aria-live="polite">'+count+'</span></div></header>'+
    '<div class="bar" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'+
    '<main id="main" tabindex="-1"><div class="card'+(onCover?' cover':'')+'">'+inner+'</div></main>'+
    (foot?'<footer><div class="ft">'+foot+'</div></footer>':'');
  var m=document.getElementById("main"); m.scrollTop=0; try{ m.focus({preventScroll:true}); }catch(e){}
}

function showPage(){
  if(visited.indexOf(page)<0) visited.push(page);
  var p=C.pages[page], last = page===C.pages.length-1;
  var blocks = p.blocks||[];
  var requiredVideos=[]; // {bi, block}
  blocks.forEach(function(b,bi){ if(b.type==="video" && b.video && b.video.required && b.video.kind!=="embed") requiredVideos.push({bi:bi, video:b.video}); });
  var mustWatch = requiredVideos.length>0 && watched.indexOf(page)<0;
  onCover=false;
  var body =
    (page===0 && C.description && !(C.design && C.design.cover) ? '<p class="muted">'+inline(C.description)+'</p>' : '') +
    '<h2>'+inline(p.heading)+'</h2>'+
    blocks.map(function(b,bi){ return blockHTML(b,bi); }).join("");
  var nextLabel = last ? (HAS_QUIZ ? "Start quiz" : "Finish") : "Next";
  shell(body, '<button id="back" '+(page===0?'disabled':'')+'>Back</button><button class="go" id="next">'+nextLabel+'</button>');
  var nextBtn=document.getElementById("next");
  if(mustWatch){
    nextBtn.disabled=true;
    var remaining=requiredVideos.length;
    requiredVideos.forEach(function(rv){
      var finished=false, vid=document.getElementById("vid-"+rv.bi), note=document.getElementById("vnote-"+rv.bi);
      function done(){
        if(finished) return; finished=true; remaining--;
        if(note){ note.textContent="Video complete. You can continue."; note.className="vnote ok"; }
        if(remaining<=0){ if(watched.indexOf(page)<0){ watched.push(page); save(); } nextBtn.disabled=false; }
      }
      if(vid){
        vid.addEventListener("ended",done);
        vid.addEventListener("timeupdate",function(){ if(vid.duration && vid.currentTime>=vid.duration-0.75) done(); });
        vid.addEventListener("error",function(){ if(note) note.textContent="The video could not be played."; done(); });
      } else done();
    });
  }
  document.getElementById("back").onclick=function(){ if(page===0 && C.design && C.design.cover){ showCover(); return; } page--; save(); showPage(); };
  if(page===0 && C.design && C.design.cover) document.getElementById("back").disabled=false;
  nextBtn.onclick=function(){
    if(p.check && checked.indexOf(page)<0){ showCheck(); return; }
    advance();
  };
  save();
}

function advance(){
  page++;
  if(page>=C.pages.length){
    if(HAS_QUIZ){ page=C.pages.length; save(); startQuiz(); }
    else { page=C.pages.length-1; markComplete(); showDone(); }
  } else { save(); showPage(); }
}
function pageIndexById(id){
  for(var i=0;i<C.pages.length;i++){ if(C.pages[i].id===id) return i; }
  return -1;
}
function gotoOrAdvance(targetId){
  var idx = targetId!=null ? pageIndexById(targetId) : -1;
  if(idx>=0){ page=idx; save(); showPage(); } else advance();
}

/* --- question types shared by knowledge checks and the final quiz ---
   "picked" shapes: mc = option index (number); match = array, picked[leftIndex] = the pair
   index the learner chose for that left item; fill = array of typed strings, one per blank. */
function qAnswered(q, picked){
  var type=q.type||"mc";
  if(type==="match"){ var p=picked||[]; return q.pairs.every(function(pr,li){ return p[li]!=null; }); }
  if(type==="fill"){ var p=picked||[]; return q.answers.every(function(a,i){ return p[i]!=null && String(p[i]).trim()!==""; }); }
  if(type==="hotspot"){ return picked!=null; }
  return picked!=null;
}
function hotspotHit(q, pt){
  if(!pt) return false;
  return (q.zones||[]).some(function(z){ return z.correct && pt.x>=z.x && pt.x<=z.x+z.w && pt.y>=z.y && pt.y<=z.y+z.h; });
}
function qCorrect(q, picked){
  var type=q.type||"mc";
  if(type==="match"){ var p=picked||[]; return q.pairs.every(function(pr,li){ return p[li]===li; }); }
  if(type==="fill"){ var p=picked||[]; return q.answers.every(function(a,i){ return String(p[i]||"").trim().toLowerCase()===String(a||"").trim().toLowerCase(); }); }
  if(type==="hotspot"){ return hotspotHit(q, picked); }
  return picked===q.correct;
}
function qBody(q, name, picked, locked, showResult, mcOrder){
  var type=q.type||"mc";
  if(type==="match"){
    var p=picked||[], right=shuffle(q.pairs.map(function(pr,pi){ return {t:pr.right, pi:pi}; }));
    var leftHtml = q.pairs.map(function(pr,li){
      var cls = showResult ? (p[li]===li ? " right" : " wrong") : (p[li]!=null ? " connected" : "");
      return '<button type="button" class="match-item'+cls+'" data-side="l" data-i="'+li+'"'+(locked?' disabled':'')+
        '><span class="match-text">'+inline(pr.left)+'</span><span class="dot"></span></button>';
    }).join("");
    var rightHtml = right.map(function(r){
      var li = p.indexOf(r.pi);
      var cls = showResult ? (li>=0 ? (li===r.pi ? " right" : " wrong") : "") : (li>=0 ? " connected" : "");
      return '<button type="button" class="match-item'+cls+'" data-side="r" data-i="'+r.pi+'"'+(locked?' disabled':'')+
        '><span class="dot"></span><span class="match-text">'+inline(r.t)+'</span></button>';
    }).join("");
    return '<p class="hint" style="margin:0 0 10px">Drag a line from each item on the left to its match on the right — or click one, then the other.</p>'+
      '<div class="match-wrap"><div class="match-cols"><div class="match-col">'+leftHtml+'</div>'+
      '<svg class="match-lines"></svg><div class="match-col">'+rightHtml+'</div></div></div>';
  }
  if(type==="fill"){
    var p=picked||[], parts=String(q.text||"").split(/_{3,}/g), html="<p class=\"fill-text\">";
    parts.forEach(function(seg,i){
      html+=inline(seg);
      if(i<parts.length-1){
        var val=p[i]!=null?p[i]:"", right=q.answers[i]||"";
        var cls = showResult ? (String(val).trim().toLowerCase()===right.trim().toLowerCase() ? " right" : " wrong") : "";
        html+='<input type="text" class="blank'+cls+'" data-blank="'+i+'" size="'+Math.max(6,right.length+2)+'" value="'+esc(val)+'"'+(locked?' disabled':'')+'>';
      }
    });
    html+="</p>";
    if(showResult) html+='<p class="fill-key muted">Accepted answer'+(q.answers.length>1?'s':'')+': '+q.answers.map(function(a){ return '<b>'+esc(a)+'</b>'; }).join(", ")+'</p>';
    return html;
  }
  if(type==="hotspot"){
    var pt=picked, hit = pt && qCorrect(q, pt);
    var marks="";
    if(showResult){
      (q.zones||[]).forEach(function(z){ if(z.correct) marks+='<div class="hs-zone right" style="left:'+z.x+'%;top:'+z.y+'%;width:'+z.w+'%;height:'+z.h+'%"></div>'; });
    }
    var pickDot = pt ? '<div class="hs-pick'+(showResult?(hit?" right":" wrong"):"")+'" style="left:'+pt.x+'%;top:'+pt.y+'%"></div>' : "";
    var altList = (q.zones||[]).map(function(z,zi){
      return '<button type="button" class="btn small" data-zone="'+zi+'"'+(locked?' disabled':'')+'>Area '+(zi+1)+'</button>';
    }).join("");
    return '<div class="hs-player" data-hs><img src="'+esc(q.image)+'" alt="'+esc(q.imageAlt||"")+'"><div class="hs-click"'+(locked?' data-locked="1"':"")+'></div>'+marks+pickDot+'</div>'+
      (altList ? '<div class="hs-alt"><span class="hint">Or choose an area: </span>'+altList+'</div>' : '');
  }
  var order = mcOrder || q.options.map(function(t,oi){ return {t:t,oi:oi}; });
  var html="";
  order.forEach(function(o){
    var oi=o.oi, cls="";
    if(showResult){ if(picked===oi) cls = picked===q.correct ? " right" : " wrong"; else if(oi===q.correct) cls=" right"; }
    html+='<label class="opt'+cls+'"><input type="radio" name="'+name+'" value="'+oi+'"'+(picked===oi?' checked':'')+(locked?' disabled':'')+'><span>'+inline(o.t)+'</span></label>';
  });
  return html;
}
function qWire(container, name, q, getPicked, setPicked, onChange){
  var type=q.type||"mc";
  if(type==="match"){
    var wrap=container.querySelector(".match-wrap"); if(!wrap) return;
    var cols=wrap.querySelector(".match-cols"), svg=wrap.querySelector("svg.match-lines");
    var items=wrap.querySelectorAll(".match-item");
    function dotCenter(btn){
      var dot=btn.querySelector(".dot"), dr=dot.getBoundingClientRect(), cr=cols.getBoundingClientRect();
      return { x: dr.left-cr.left+dr.width/2, y: dr.top-cr.top+dr.height/2 };
    }
    function redraw(){
      // This only runs while the question is still interactive (connect() is only reachable
      // from a non-disabled button), so it's safe to drive "connected" purely off picked state
      // without touching the right/wrong classes qBody() already baked in for the locked/graded view.
      var p=getPicked()||[];
      items.forEach(function(btn){
        if(btn.disabled) return;
        var side=btn.dataset.side, i=+btn.dataset.i;
        var on = side==="l" ? p[i]!=null : p.indexOf(i)>=0;
        btn.classList.toggle("connected", on);
      });
      var cr=cols.getBoundingClientRect();
      svg.setAttribute("width", cr.width); svg.setAttribute("height", cr.height);
      var html="";
      q.pairs.forEach(function(pr,li){
        if(p[li]==null) return;
        var lBtn=wrap.querySelector('.match-item[data-side="l"][data-i="'+li+'"]');
        var rBtn=wrap.querySelector('.match-item[data-side="r"][data-i="'+p[li]+'"]');
        if(!lBtn||!rBtn) return;
        var a=dotCenter(lBtn), b=dotCenter(rBtn);
        html+='<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" class="'+lBtn.className.replace("match-item","").trim()+'"></line>';
      });
      svg.innerHTML=html;
    }
    redraw();
    try{ new (window.ResizeObserver||function(){ this.observe=function(){}; })(redraw).observe(cols); }catch(e){}
    var armed=null, suppressClick=false;
    function clearArmed(){ if(armed){ armed.classList.remove("armed"); armed.removeAttribute("aria-pressed"); armed=null; } }
    function connect(li, pi){
      var p=(getPicked()||[]).slice();
      for(var i=0;i<p.length;i++){ if(p[i]===pi && i!==li) p[i]=null; }
      p[li]=pi; setPicked(p); clearArmed(); redraw(); onChange();
    }
    items.forEach(function(btn){
      if(btn.disabled) return;
      var side=btn.dataset.side, i=+btn.dataset.i;
      btn.addEventListener("click", function(){
        if(suppressClick) return;
        if(side==="l"){
          if(armed===btn){ clearArmed(); return; }
          clearArmed(); btn.classList.add("armed"); btn.setAttribute("aria-pressed","true"); armed=btn;
        } else if(side==="r" && armed){
          connect(+armed.dataset.i, i);
        }
      });
      if(side==="l"){
        btn.addEventListener("pointerdown", function(e){
          if(e.button!=null && e.button!==0) return;
          var start=dotCenter(btn);
          var dragLine=document.createElementNS("http://www.w3.org/2000/svg","line");
          dragLine.setAttribute("class","drag"); dragLine.setAttribute("x1",start.x); dragLine.setAttribute("y1",start.y);
          dragLine.setAttribute("x2",start.x); dragLine.setAttribute("y2",start.y);
          svg.appendChild(dragLine);
          var moved=false;
          function onMove(ev){
            moved=true;
            var cr=cols.getBoundingClientRect();
            dragLine.setAttribute("x2", ev.clientX-cr.left); dragLine.setAttribute("y2", ev.clientY-cr.top);
          }
          function onUp(ev){
            document.removeEventListener("pointermove", onMove);
            document.removeEventListener("pointerup", onUp);
            try{ dragLine.remove(); }catch(e){}
            if(moved){
              suppressClick=true; setTimeout(function(){ suppressClick=false; },0);
              var target=document.elementFromPoint ? document.elementFromPoint(ev.clientX, ev.clientY) : null;
              var rBtn=target && target.closest ? target.closest('.match-item[data-side="r"]') : null;
              if(rBtn && !rBtn.disabled && wrap.contains(rBtn)) connect(i, +rBtn.dataset.i);
            }
          }
          document.addEventListener("pointermove", onMove);
          document.addEventListener("pointerup", onUp, {once:true});
        });
      }
    });
  } else if(type==="fill"){
    container.querySelectorAll('input[data-blank]').forEach(function(inp){
      inp.oninput=function(){ var arr=(getPicked()||[]).slice(); arr[+inp.dataset.blank]=inp.value; setPicked(arr); onChange(); };
    });
  } else if(type==="hotspot"){
    var stage=container.querySelector("[data-hs]");
    if(stage){
      // qBody() only bakes the pick-dot into the HTML at render time (same gotcha as match's
      // .connected class) - place/move it directly here so clicking shows feedback immediately.
      function placeDot(pt){
        var dot=stage.querySelector(".hs-pick");
        if(!dot){ dot=document.createElement("div"); dot.className="hs-pick"; stage.appendChild(dot); }
        dot.style.left=pt.x+"%"; dot.style.top=pt.y+"%";
      }
      var clickLayer=stage.querySelector(".hs-click");
      if(clickLayer && !clickLayer.dataset.locked){
        clickLayer.addEventListener("click", function(e){
          var r=clickLayer.getBoundingClientRect();
          var pt={x: Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)), y: Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))};
          setPicked(pt); placeDot(pt); onChange();
        });
      }
      container.querySelectorAll(".hs-alt button[data-zone]").forEach(function(btn){
        if(btn.disabled) return;
        btn.addEventListener("click", function(){
          var z=q.zones[+btn.dataset.zone]; if(!z) return;
          var pt={x: z.x+z.w/2, y: z.y+z.h/2};
          setPicked(pt); placeDot(pt); onChange();
        });
      });
    }
  } else {
    container.querySelectorAll('input[name="'+name+'"]').forEach(function(r){
      r.onchange=function(){ setPicked(+r.value); onChange(); };
    });
  }
}

/* --- knowledge check after a page --- */
function showCheck(){
  onCover=false;
  var p=C.pages[page], K=p.check, picks={}, marked=null;
  function draw(){
    var html='<span class="tag">Knowledge check</span><h2>'+inline(p.heading)+'</h2>'+
      '<p class="muted">'+(K.mustPass?'Answer '+(K.questions.length===1?'this question':'these questions')+' correctly to carry on.':'Quick practice. This does not count towards your score.')+'</p>';
    K.questions.forEach(function(q,qi){
      var res = marked ? marked[qi] : null, locked = !!(res && (res.ok || !K.mustPass));
      html+='<fieldset class="q" style="border:0;padding:0"><legend><h3>'+(K.questions.length>1?(qi+1)+'. ':'')+inline(q.q)+'</h3></legend>'+
        qBody(q, 'k'+qi, picks[qi], locked, !!res);
      if(res){
        html+='<div class="verdict '+(res.ok?'ok':'no')+'"><strong>'+(res.ok?'Correct.':'Not quite.')+'</strong>'+
          (res.ok ? (q.feedback ? ' '+inline(q.feedback) : '')
                  : K.mustPass ? ' Have another look at the page, then try again.'
                  : ' The correct answer is highlighted in green.'+(q.feedback ? ' '+inline(q.feedback) : ''))+'</div>';
      }
      html+='</fieldset>';
    });
    var allOk = marked && marked.every(function(r){ return r.ok; });
    var foot;
    if(!marked) foot='<button id="kback">Back to page</button><button class="go" id="kcheck" disabled>Check answers</button>';
    else if(allOk || !K.mustPass) foot='<button id="kback">Back to page</button><button class="go" id="kgo">Continue</button>';
    else foot='<button id="kback">Back to page</button><button class="go" id="kretry">Try again</button>';
    shell(html, foot);
    var cnt=document.querySelector(".count"); if(cnt) cnt.textContent="Page "+(page+1)+" of "+C.pages.length+" · Knowledge check";
    function allAnswered(){ return K.questions.every(function(q,qi){ return qAnswered(q, picks[qi]); }); }
    var fieldsets=app.querySelectorAll("fieldset.q");
    K.questions.forEach(function(q,qi){
      qWire(fieldsets[qi], 'k'+qi, q, function(){ return picks[qi]; }, function(v){ picks[qi]=v; }, function(){
        var c=document.getElementById("kcheck"); if(c) c.disabled=!allAnswered();
      });
    });
    var b;
    if(b=document.getElementById("kcheck")){ b.disabled=!allAnswered(); b.onclick=function(){
      marked=K.questions.map(function(q,qi){ return {ok:qCorrect(q, picks[qi])}; });
      if(marked.every(function(r){ return r.ok; }) || !K.mustPass){ if(checked.indexOf(page)<0){ checked.push(page); save(); } }
      draw();
    }; }
    if(b=document.getElementById("kretry")) b.onclick=function(){
      // keep the right answers, clear the wrong ones
      marked.forEach(function(r,qi){ if(!r.ok) picks[qi]=undefined; });
      var keep=marked; marked=null; draw();
      var fs2=app.querySelectorAll("fieldset.q");
      keep.forEach(function(r,qi){ if(r.ok && fs2[qi]) fs2[qi].querySelectorAll("input,select,button.match-item").forEach(function(x){ x.disabled=true; }); });
    };
    if(b=document.getElementById("kgo")) b.onclick=function(){
      var br=K.branch||{};
      gotoOrAdvance(allOk ? br.pass : br.fail);
    };
    if(b=document.getElementById("kback")) b.onclick=function(){ showPage(); };
  }
  draw();
}

function startQuiz(){
  answers={}; result=null;
  quizOrder = C.quiz.map(function(q,i){
    var item={i:i};
    if((q.type||"mc")==="mc"){ var o=q.options.map(function(t,oi){ return {t:t,oi:oi}; }); item.opts = C.shuffle?shuffle(o):o; }
    return item;
  });
  if(C.shuffle) quizOrder=shuffle(quizOrder);
  showQuiz();
}
function showQuiz(){
  onCover=false;
  var html='<span class="tag">Assessment</span><h2>Check your understanding</h2><p class="muted">Answer every question, then submit. You need '+C.passMark+'% to pass.</p>';
  quizOrder.forEach(function(item,n){
    var q=C.quiz[item.i];
    html+='<fieldset class="q" style="border:0;padding:0"><legend><h3>'+(n+1)+'. '+inline(q.q)+'</h3></legend>'+
      qBody(q, 'q'+item.i, answers[item.i], !!result, !!(result && C.showAnswers), item.opts);
    if(result && C.showAnswers && q.feedback) html+='<div class="fb">'+inline(q.feedback)+'</div>';
    html+='</fieldset>';
  });
  if(result){
    html='<div style="margin-bottom:28px"><span class="tag">Your result</span><div class="score '+(result.passed?'pass':'fail')+'">'+result.pct+'%</div><p><strong>'+(result.passed?'Well done, you passed.':'Not quite. You need '+C.passMark+'% to pass.')+'</strong> You answered '+result.right+' of '+C.quiz.length+' correctly.</p></div>'+(C.showAnswers?html:'');
  }
  var foot;
  if(!result) foot='<button id="back">Back to pages</button><button class="go" id="submit" disabled>Submit answers</button>';
  else if(result.passed) foot='<span></span><button class="go" id="finish">Finish course</button>';
  else if(C.allowRetry) foot='<button id="review">Review pages</button><button class="go" id="retry">Try again</button>';
  else foot='<span></span><button class="go" id="finish">Close course</button>';
  shell(html, foot);
  var sub=document.getElementById("submit");
  if(sub){
    function allAnswered(){ return quizOrder.every(function(item){ return qAnswered(C.quiz[item.i], answers[item.i]); }); }
    var fieldsets=app.querySelectorAll("fieldset.q");
    quizOrder.forEach(function(item,n){
      qWire(fieldsets[n], 'q'+item.i, C.quiz[item.i], function(){ return answers[item.i]; }, function(v){ answers[item.i]=v; }, function(){ sub.disabled=!allAnswered(); });
    });
    sub.disabled=!allAnswered();
    sub.onclick=function(){
      var right=0; C.quiz.forEach(function(q,i){ if(qCorrect(q, answers[i])) right++; });
      var pct=Math.round(right/C.quiz.length*100);
      result={right:right,pct:pct,passed:pct>=C.passMark};
      reportScore(pct,result.passed);
      showQuiz();
    };
    document.getElementById("back").onclick=function(){ page=C.pages.length-1; save(); showPage(); };
  }
  var b;
  if(b=document.getElementById("retry")) b.onclick=startQuiz;
  if(b=document.getElementById("review")) b.onclick=function(){ page=0; save(); showPage(); };
  if(b=document.getElementById("finish")) b.onclick=function(){ showDone(); };
}

function showDone(){
  onCover=false;
  var passed = !HAS_QUIZ || (lastScore!=null && lastScore>=C.passMark);
  var msg = HAS_QUIZ ? (passed ? "You passed with "+lastScore+"%." : "Your result has been recorded.") : "You have reached the end of this course.";
  var badge = (C.showBadge && passed) ?
    '<div class="badge" aria-hidden="true"><svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="var(--on-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg></div>' : '';
  shell(badge+'<span class="tag">Complete</span><h2>'+esc(C.title)+'</h2><p>'+msg+'</p><p class="muted">Your progress has been saved'+(S.api?' to the learning platform':'')+'. You can now close this window.</p>',
    '<button id="again">Go back through the pages</button><button class="go" id="close">Close</button>');
  document.getElementById("again").onclick=function(){ page=0; save(); showPage(); };
  document.getElementById("close").onclick=function(){
    terminate();
    try{ window.close(); }catch(e){}
    // Still here after a tick means close() had no effect (e.g. Bridge's "Current window" mode,
    // which isn't a window script opened and so can't close itself) - tell the learner what to do.
    setTimeout(function(){
      var b=document.getElementById("close"); if(!b) return;
      shell(badge+'<span class="tag">Complete</span><h2>'+esc(C.title)+'</h2>'+
        '<p class="muted">Your progress is saved. You can now return to Bridge.</p>', '');
    }, 250);
  };
}

/* --- start --- */
if(C.previewStart==="cover" && C.design && C.design.cover) showCover();
else if(C.previewStart==="quiz" && HAS_QUIZ){ page=C.pages.length; startQuiz(); }

else if(finished && page>=C.pages.length-1 && !HAS_QUIZ) showDone();
else if(HAS_QUIZ && page>=C.pages.length) startQuiz();
else { if(page>=C.pages.length) page=C.pages.length-1; showPage(); }
}).replace(/^function\s*\(\)\s*\{/,"").replace(/\}\s*$/,"");

function dataUrlToBytes(u){
  var m=u.match(/^data:([^;,]+)(?:;[^,]*)?;base64,(.*)$/);
  if(!m){ var t=u.match(/^data:([^;,]+)[^,]*,(.*)$/); var txt=decodeURIComponent(t[2]); return {type:t[1], bytes:new TextEncoder().encode(txt)}; }
  var bin=atob(m[2]); var a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return {type:m[1], bytes:a};
}
function buildZip(){
  var zip=new JSZip(), imageMap={}, videoMap={}, files=["index.html"];
  state.pages.forEach(function(p,i){
    (p.blocks||[]).forEach(function(b,bi){
      if(b.type==="image" && b.image){
        var d=dataUrlToBytes(b.image); var ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"})[d.type]||"img";
        var name="media/page-"+(i+1)+"-"+(bi+1)+"."+ext; zip.file(name,d.bytes); imageMap[b.id]=name; files.push(name);
      }
      if(b.type==="video" && b.video && b.video.kind==="file" && videoStore[b.video.key]){
        var vn="media/page-"+(i+1)+"-"+(bi+1)+"-video."+videoExt(b.video);
        zip.file(vn, videoStore[b.video.key], {compression:"STORE"}); videoMap[b.id]=vn; files.push(vn);
      }
    });
  });
  var assetMap={}, extOf={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","image/svg+xml":"svg"};
  [["logo","logo"],["coverImage","cover"]].forEach(function(a){
    var u=state.design[a[0]]; if(!u) return;
    var d=dataUrlToBytes(u), name="media/"+a[1]+"."+(extOf[d.type]||"img");
    zip.file(name,d.bytes); assetMap[a[1]]=name; files.push(name);
  });
  var hotspotMap={};
  function exportHotspotImages(questions){
    (questions||[]).forEach(function(q){
      if(q.type!=="hotspot" || !q.image) return;
      var d=dataUrlToBytes(q.image), ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif"})[d.type]||"img";
      var name="media/hotspot-"+q.id+"."+ext; zip.file(name,d.bytes); hotspotMap[q.id]=name; files.push(name);
    });
  }
  exportHotspotImages(state.quiz);
  state.pages.forEach(function(p){ if(p.check) exportHotspotImages(p.check.questions); });
  zip.file("index.html", playerHTML(courseData(imageMap, videoMap, assetMap, hotspotMap)));
  zip.file("imsmanifest.xml", manifest(files));
  return {zip:zip, files:["imsmanifest.xml"].concat(files)};
}

/* ---------- saving files ---------- */
var dlPromise = null;
function downloads(){ if(!dlPromise){ dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function(){ return null; }) : Promise.resolve(null); } return dlPromise; }
function plainDownload(filename, data){
  var blob = data instanceof Blob ? data : new Blob([data], {type: /\.json$/.test(filename) ? "application/json" : "application/octet-stream"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=filename; a.style.display="none"; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 60000);
  return true;
}
function saveFile(filename, data){
  return downloads().then(function(dl){
    if(!dl){
      if(window.claude){ toast("Saving files is not available in this view. Open the page in claude.ai to download."); return false; }
      return plainDownload(filename, data);
    }
    return dl.save({filename:filename, data:data}).then(function(){ return true; }, function(err){
      var c=err && err.code;
      if(c==="declined") toast("Download cancelled");
      else if(c==="rate_limited") toast("A download prompt is already open");
      else toast("The file could not be saved here ("+(c||"unknown")+").");
      return false;
    });
  });
}

      '<div class="dialog-actions"><button class="btn" type="button" id="ex-close">Cancel</button><button class="btn primary" type="button" id="ex-go">Download '+esc(name)+'</button></div>';

});

/* ---------- import from Word (.docx) and PowerPoint (.pptx) ---------- */
var IMG_TYPES = {png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",bmp:"image/bmp"};
function xml(s){ return new DOMParser().parseFromString(s||"<x/>","application/xml"); }
function desc(node,name){ return node ? Array.prototype.slice.call(node.getElementsByTagNameNS("*",name)) : []; }
function kids(node,name){ return node ? Array.prototype.filter.call(node.childNodes,function(c){ return c.nodeType===1 && (!name || c.localName===name); }) : []; }
function attr(node,local){ if(!node) return null; for(var i=0;i<node.attributes.length;i++){ var a=node.attributes[i]; if(a.localName===local) return a.value; } return null; }
function zstr(zip,path){ var f=zip.file(path); return f ? f.async("string") : Promise.resolve(""); }
function relMap(xmlText){ var m={}; desc(xml(xmlText),"Relationship").forEach(function(r){ m[r.getAttribute("Id")]={target:r.getAttribute("Target"), type:r.getAttribute("Type")||"", external:r.getAttribute("TargetMode")==="External"}; }); return m; }
function resolvePath(base,target){
  if(target.charAt(0)==="/") return target.slice(1);
  var parts=base.split("/"); parts.pop();
  target.split("/").forEach(function(s){ if(s==="..") parts.pop(); else if(s && s!==".") parts.push(s); });
  return parts.join("/");
}
function coreTitle(zip){ return zstr(zip,"docProps/core.xml").then(function(t){ var n=desc(xml(t),"title")[0]; return n ? n.textContent.trim() : ""; }); }
function boldWrap(segs){
  // segs: [{t, b}] -> text with **bold** marks, merging neighbours
  var out=[], cur=null;
  segs.forEach(function(s){ if(cur && cur.b===s.b) cur.t+=s.t; else { cur={t:s.t,b:s.b}; out.push(cur); } });
  return out.map(function(s){
    if(!s.b || !s.t.trim()) return s.t;
    var m=s.t.match(/^(\s*)([\s\S]*?)(\s*)$/); return m[1]+"**"+m[2]+"**"+m[3];
  }).join("").replace(/[ \t]+/g," ").trim();
}
function isOn(rPr,name){ var n=kids(rPr,name)[0]; if(!n) return false; var v=attr(n,"val"); return v===null || !/^(0|false|off|none)$/i.test(v); }
function loadImage(zip, path){
  var ext=(path.split(".").pop()||"").toLowerCase(), type=IMG_TYPES[ext];
  var f=zip.file(path); if(!type || !f) return Promise.resolve(null);
  return f.async("uint8array").then(function(u){ return {blob:new Blob([u],{type:type}), size:u.length}; });
}

function parseDocx(zip, fname, onStatus){
  var docPath="word/document.xml";
  if(!zip.file(docPath)) return Promise.reject(new Error("This does not look like a Word .docx file."));
  return Promise.all([zstr(zip,docPath), zstr(zip,"word/styles.xml"), zstr(zip,"word/_rels/document.xml.rels"), coreTitle(zip)]).then(function(r){
    var doc=xml(r[0]), rels=relMap(r[2]), styles={};
    desc(xml(r[1]),"style").forEach(function(s){
      var id=attr(s,"styleId"), nameEl=kids(s,"name")[0], name=nameEl?attr(nameEl,"val")||"":"";
      var lvl=null, m=name.match(/^heading\s*(\d)$/i);
      if(m) lvl=+m[1]; else if(/^title$/i.test(name)) lvl=0;
      else { var ol=desc(s,"outlineLvl")[0]; if(ol && attr(ol,"val")!=null && +attr(ol,"val")<9) lvl=+attr(ol,"val")+1; }
      styles[id]={name:name, level:lvl, list:/list/i.test(name)};
    });
    var blocks=[], skipped=0;
    function para(p){
      var pPr=kids(p,"pPr")[0], st=kids(pPr,"pStyle")[0], sid=st?attr(st,"val"):null, sinfo=styles[sid]||{};
      var level=sinfo.level;
      var ol=kids(pPr,"outlineLvl")[0]; if(ol && level==null && +attr(ol,"val")<9) level=+attr(ol,"val")+1;
      if(level==null && sid){ var m=sid.match(/^heading(\d)$/i); if(m) level=+m[1]; else if(/^title$/i.test(sid)) level=0; }
      var segs=[];
      desc(p,"r").forEach(function(run){
        if(run.parentNode && run.parentNode.localName==="txbxContent") return;
        var b=isOn(kids(run,"rPr")[0],"b");
        kids(run).forEach(function(c){
          if(c.localName==="t") segs.push({t:c.textContent,b:b});
          else if(c.localName==="tab") segs.push({t:" ",b:b});
          else if(c.localName==="br" || c.localName==="cr") segs.push({t:" ",b:b});
        });
      });
      var text=boldWrap(segs);
      desc(p,"drawing").concat(desc(p,"pict")).forEach(function(dr){
        var blip=desc(dr,"blip")[0], id=blip?attr(blip,"embed"):null;
        if(!id){ var im=desc(dr,"imagedata")[0]; id=im?attr(im,"id"):null; }
        var rel=id && rels[id];
        if(rel && !rel.external){
          var path=resolvePath(docPath, rel.target), ext=(path.split(".").pop()||"").toLowerCase();
          var dp=desc(dr,"docPr")[0];
          if(IMG_TYPES[ext]) blocks.push({type:"img", path:path, alt:dp?(attr(dp,"descr")||""):""}); else skipped++;
        }
      });
      if(!text) return;
      var plain=text.replace(/\*\*/g,"");
      if(level!=null){ blocks.push({type:"h", level:level, text:plain}); return; }
      var bullet = !!kids(pPr,"numPr")[0] || !!sinfo.list;
      var allBold = /^\*\*[^*]+\*\*$/.test(text) && plain.length<90;
      blocks.push({type:"p", text:text, bullet:bullet, allBold:allBold && !bullet});
    }
    function walk(node){
      kids(node).forEach(function(c){
        if(c.localName==="p") para(c);
        else if(c.localName==="tbl"){
          desc(c,"tr").forEach(function(tr){
            var cells=kids(tr,"tc").map(function(tc){ return desc(tc,"t").map(function(t){ return t.textContent; }).join("").trim(); }).filter(Boolean);
            if(cells.length) blocks.push({type:"p", text:cells.join(" · "), bullet:true});
          });
        }
        else if(c.localName==="sdt" || c.localName==="sdtContent" || c.localName==="customXml") walk(c);
      });
    }
    walk(desc(doc,"body")[0]);

    var title=r[3];
    var t0=blocks.filter(function(b){ return b.type==="h" && b.level===0; })[0];
    if(t0){ title=title||t0.text; }
    var levels=blocks.filter(function(b){ return b.type==="h" && b.level>0; }).map(function(b){ return b.level; });
    var split = levels.length ? Math.min.apply(null,levels) : null;
    var useBold = split==null && blocks.some(function(b){ return b.allBold; });
    var pages=[], cur=null;
    function start(h){ cur={heading:h, lines:[], images:[]}; pages.push(cur); }
    function addLine(text,bullet){
      if(!cur) start(pages.length ? "Continued" : "Introduction");
      var prev=cur.lines[cur.lines.length-1];
      cur.lines.push({t:(bullet?"- ":"")+text, joinPrev: !!(prev && bullet && prev.bullet), bullet:bullet});
    }
    blocks.forEach(function(b){
      if(b.type==="h"){
        if(b.level===0 && b===t0) return;
        if(split!=null && b.level<=split) start(b.text);
        else addLine("**"+b.text+"**", false);
      } else if(b.type==="p"){
        if(useBold && b.allBold) start(b.text.replace(/\*\*/g,""));
        else addLine(b.text, b.bullet);
      } else if(b.type==="img"){
        if(!cur) start("Introduction");
        cur.images.push(b);
      }
    });
    if(!title) title=fname.replace(/\.[^.]+$/,"");
    return {title:title, skippedImages:skipped, pages:pages.map(function(p){
      var body=p.lines.reduce(function(acc,l){ return acc ? acc+(l.joinPrev?"\n":"\n\n")+l.t : l.t; },"");
      return {heading:p.heading, body:body, imgs:p.images};
    }).filter(function(p){ return p.heading || p.body || p.imgs.length; })};
  });
}

function parsePptx(zip, fname, opts){
  var presPath="ppt/presentation.xml";
  if(!zip.file(presPath)) return Promise.reject(new Error("This does not look like a PowerPoint .pptx file."));
  return Promise.all([zstr(zip,presPath), zstr(zip,"ppt/_rels/presentation.xml.rels"), coreTitle(zip)]).then(function(r){
    var rels=relMap(r[1]);
    var relId=function(n){ for(var i=0;i<n.attributes.length;i++){ var a=n.attributes[i]; if(a.localName==="id" && /relationships/.test(a.namespaceURI||"")) return a.value; } return null; };
    var paths=desc(xml(r[0]),"sldId").map(function(s){ var rel=rels[relId(s)]; return rel ? resolvePath(presPath, rel.target) : null; }).filter(Boolean);
    var skipped=0, hidden=0;
    function paraText(p){
      var segs=[];
      kids(p).forEach(function(c){
        if(c.localName==="r" || c.localName==="fld"){ var t=kids(c,"t")[0]; if(t) segs.push({t:t.textContent, b:attr(kids(c,"rPr")[0],"b")==="1"}); }
        else if(c.localName==="br") segs.push({t:" ",b:false});
      });
      return boldWrap(segs);
    }
    function pos(node){ var off=desc(node,"off")[0]; return off ? {y:+attr(off,"y")||0, x:+attr(off,"x")||0} : {y:0,x:0}; }
    function readSlide(path, idx){
      return Promise.all([zstr(zip,path), zstr(zip, resolvePath(path,"_rels/"+path.split("/").pop()+".rels"))]).then(function(sr){
        var sdoc=xml(sr[0]), srels=relMap(sr[1]);
        var root=desc(sdoc,"sld")[0];
        if(root && attr(root,"show")==="0"){ hidden++; return null; }
        var title="", items=[], pics=[];
        function walk(tree){
          kids(tree).forEach(function(n){
            var ln=n.localName;
            if(ln==="grpSp"){ walk(n); return; }
            if(ln==="sp"){
              var ph=desc(n,"ph")[0], type=ph?(attr(ph,"type")||"body"):null;
              if(type && /^(dt|ftr|sldNum|hdr)$/.test(type)) return;
              var tx=desc(n,"txBody")[0];
              if(tx){
                var paras=kids(tx,"p").map(function(p){ return {text:paraText(p), lvl:+(attr(kids(p,"pPr")[0],"lvl")||0), noBu:!!desc(kids(p,"pPr")[0],"buNone")[0], bu:!!(desc(kids(p,"pPr")[0],"buChar")[0]||desc(kids(p,"pPr")[0],"buAutoNum")[0])}; }).filter(function(p){ return p.text; });
                if(type==="title" || type==="ctrTitle"){ if(!title) title=paras.map(function(p){ return p.text.replace(/\*\*/g,""); }).join(" "); }
                else if(paras.length) items.push({p:pos(n), kind: (type && type!=="subTitle") ? "list" : "text", paras:paras});
              }
              desc(n,"blip").forEach(function(b){ pics.push({id:attr(b,"embed"), alt:attr(desc(n,"cNvPr")[0],"descr")||""}); });
            } else if(ln==="pic"){
              var b=desc(n,"blip")[0]; if(b) pics.push({id:attr(b,"embed"), alt:attr(desc(n,"cNvPr")[0],"descr")||""});
            } else if(ln==="graphicFrame"){
              var rows=desc(n,"tr").map(function(tr){ return kids(tr,"tc").map(function(tc){ return desc(tc,"t").map(function(t){ return t.textContent; }).join("").trim(); }).filter(Boolean).join(" · "); }).filter(Boolean);
              if(rows.length) items.push({p:pos(n), kind:"list", paras:rows.map(function(t){ return {text:t,lvl:0,noBu:false}; })});
            }
          });
        }
        walk(desc(sdoc,"spTree")[0]);
        items.sort(function(a,b){ return (a.p.y-b.p.y) || (a.p.x-b.p.x); });
        var chunks=[];
        items.forEach(function(it){
          if(it.kind==="list"){
            var lines=it.paras.map(function(p){ return (p.noBu && !p.bu) ? p.text : "- "+p.text; });
            // a single unbulleted line reads better as a sentence
            if(lines.length===1 && !it.paras[0].bu) lines=[it.paras[0].text];
            var buf=[], grp=[];
            lines.forEach(function(l){ if(/^- /.test(l)) grp.push(l); else { if(grp.length){ buf.push(grp.join("\n")); grp=[]; } buf.push(l); } });
            if(grp.length) buf.push(grp.join("\n"));
            chunks.push(buf.join("\n\n"));
          } else chunks.push(it.paras.map(function(p){ return p.text; }).join("\n\n"));
        });
        var picPaths=[];
        pics.forEach(function(pc){
          var rel=pc.id && srels[pc.id]; if(!rel || rel.external) return;
          var pth=resolvePath(path, rel.target), ext=(pth.split(".").pop()||"").toLowerCase();
          if(IMG_TYPES[ext]) picPaths.push({path:pth, alt:pc.alt}); else skipped++;
        });
        var notesRel=Object.keys(srels).map(function(k){ return srels[k]; }).filter(function(x){ return /notesSlide$/.test(x.type); })[0];
        var notesP = (opts.notes && notesRel) ? zstr(zip, resolvePath(path, notesRel.target)) : Promise.resolve("");
        return notesP.then(function(nx){
          if(nx){
            var nd=xml(nx), notes=[];
            desc(nd,"sp").forEach(function(sp){ var ph=desc(sp,"ph")[0]; if(ph && attr(ph,"type")==="body"){ desc(sp,"p").forEach(function(p){ var t=paraText(p); if(t) notes.push(t); }); } });
            if(notes.length) chunks.push(notes.join("\n\n"));
          }
          // keep the biggest picture: usually the main visual rather than a logo
          return Promise.all(picPaths.map(function(pp){ var f=zip.file(pp.path); return f ? f.async("uint8array").then(function(u){ return {path:pp.path, alt:pp.alt, size:u.length}; }) : null; })).then(function(sizes){
            sizes=sizes.filter(Boolean).sort(function(a,b){ return b.size-a.size; });
            return {heading: title || "Slide "+(idx+1), body: chunks.filter(Boolean).join("\n\n"), imgs: sizes.length ? [sizes[0]] : []};
          });
        });
      });
    }
    return paths.reduce(function(pr,pth,i){ return pr.then(function(acc){ return readSlide(pth,i).then(function(s){ if(s) acc.push(s); return acc; }); }); }, Promise.resolve([])).then(function(pages){
      var title=r[2] || (pages[0] && !/^Slide \d+$/.test(pages[0].heading) ? pages[0].heading : "") || fname.replace(/\.[^.]+$/,"");
      return {title:title, pages:pages, skippedImages:skipped, hiddenSlides:hidden};
    });
  });
}

/* --- PDF (read with pdf.js, loaded only when a PDF is chosen) --- */
var PDFJS_BASE="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/", pdfjsReady=null;
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function getPdfjs(){
  if(window.pdfjsLib && window.pdfjsWorker) return Promise.resolve(window.pdfjsLib);
  if(!pdfjsReady){
    // the worker code runs on the page itself, because the viewer does not allow separate worker files
    pdfjsReady = loadScript(PDFJS_BASE+"pdf.min.js").then(function(){ return loadScript(PDFJS_BASE+"pdf.worker.min.js"); }).then(function(){
      if(!window.pdfjsLib) throw 0;
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_BASE+"pdf.worker.min.js";
      return window.pdfjsLib;
    }).catch(function(){ pdfjsReady=null; throw new Error("The PDF reader could not be loaded. Check your internet connection and try again."); });
  }
  return pdfjsReady;
}
var BULLET_RE=/^\s*[•●○◦▪■□➢►▶✓✔•▪●\-–]\s*/;
function pdfLines(items){
  var its=items.filter(function(i){ return typeof i.str==="string" && i.str.length; }).map(function(i){
    var t=i.transform; return {s:i.str, x:t[4], y:t[5], size:Math.abs(t[3])||Math.hypot(t[2],t[3])||i.height||10, w:i.width||0};
  });
  its.sort(function(a,b){ return (b.y-a.y) || (a.x-b.x); });
  var lines=[], cur=null;
  its.forEach(function(it){
    if(cur && Math.abs(cur.y-it.y) < Math.max(2, Math.min(cur.size||it.size, it.size)*0.45)) cur.items.push(it);
    else { cur={y:it.y, size:0, items:[it]}; lines.push(cur); }
    if(it.s.trim()) cur.size=Math.max(cur.size, it.size);
  });
  return lines.map(function(l){
    l.items.sort(function(a,b){ return a.x-b.x; });
    var text="", end=null;
    l.items.forEach(function(it){
      if(end!=null && it.x-end > it.size*0.15 && !/\s$/.test(text) && !/^\s/.test(it.s)) text+=" ";
      text+=it.s; end=it.x+it.w;
    });
    return {y:l.y, size:l.size||10, text:text.replace(/\s+/g," ").trim()};
  }).filter(function(l){ return l.text; });
}
function median(a){ if(!a.length) return 10; a=a.slice().sort(function(x,y){ return x-y; }); return a[Math.floor((a.length-1)/2)]; }
function pdfPageContent(lines){
  // returns {heading, paras:[{t,bullet}]}
  var sizes=[]; lines.forEach(function(l){ for(var i=0;i<Math.min(l.text.length,400);i+=10) sizes.push(l.size); });
  var body=median(sizes), heading="", used={};
  var cands=lines.filter(function(l){ return l.text.length>=2 && l.text.length<=120 && !BULLET_RE.test(l.text); });
  var max=cands.reduce(function(m,l){ return Math.max(m,l.size); },0);
  if(cands.length && max>=body*1.18){
    var first=lines.indexOf(cands.filter(function(l){ return l.size===max; })[0]);
    var parts=[lines[first].text]; used[first]=1;
    if(lines[first+1] && Math.abs(lines[first+1].size-max)<0.6 && parts[0].length+lines[first+1].text.length<140){ parts.push(lines[first+1].text); used[first+1]=1; }
    heading=parts.join(" ");
  }
  var paras=[], prev=null;
  lines.forEach(function(l,i){
    if(used[i]) { prev=null; return; }
    var isBullet=BULLET_RE.test(l.text), t=isBullet ? l.text.replace(BULLET_RE,"") : l.text;
    if(!t) return;
    var big = l.size>=body*1.18 && t.length<=120;
    var gap = prev ? prev.y-l.y : 0, lh=(prev?prev.size:l.size)*1.25;
    var newPara = !prev || isBullet || big || prev.big || gap>lh*1.4 || Math.abs(prev.size-l.size)>1.2;
    if(newPara) paras.push({t:big?"**"+t+"**":t, bullet:isBullet});
    else { var last=paras[paras.length-1]; last.t = /-$/.test(last.t) ? last.t.slice(0,-1)+t : last.t+" "+t; }
    prev={y:l.y,size:l.size,big:big};
  });
  return {heading:heading, paras:paras};
}
function parasToBody(paras){
  return paras.reduce(function(acc,p,i){
    var line=(p.bullet?"- ":"")+p.t; if(!acc) return line;
    return acc+((p.bullet && paras[i-1].bullet)?"\n":"\n\n")+line;
  },"");
}
function parsePdf(file, opts, onStatus){
  return getPdfjs().then(function(lib){
    return file.arrayBuffer().then(function(buf){
      return lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false, useSystemFonts:true}).promise;
    }).catch(function(e){
      if(e && e.name==="PasswordException") throw new Error("That PDF is password protected. Remove the password and try again.");
      throw new Error(e && e.message && /PDF reader/.test(e.message) ? e.message : "That PDF could not be opened. It may be damaged.");
    });
  }).then(function(pdf){
    var n=pdf.numPages, raw=[];
    var seq=Promise.resolve();
    for(var i=1;i<=n;i++){ (function(i){ seq=seq.then(function(){
      if(onStatus) onStatus("Reading page "+i+" of "+n+"…");
      return pdf.getPage(i).then(function(pg){
        var vp=pg.getViewport({scale:1});
        return pg.getTextContent().then(function(tc){ raw.push({n:i, landscape:vp.width>vp.height*1.05, lines:pdfLines(tc.items)}); });
      });
    }); })(i); }
    return seq.then(function(){
      // strip repeated headers/footers and bare page numbers
      var key=function(t){ return t.toLowerCase().replace(/\d+/g,"#"); }, counts={};
      raw.forEach(function(p){ var seen={}; p.lines.slice(0,2).concat(p.lines.slice(-2)).forEach(function(l){ var k=key(l.text); if(!seen[k]){ seen[k]=1; counts[k]=(counts[k]||0)+1; } }); });
      var limit=Math.max(3, Math.ceil(raw.length*0.5));
      raw.forEach(function(p){
        var edge=p.lines.slice(0,2).concat(p.lines.slice(-2));
        p.lines=p.lines.filter(function(l){
          if(/^(page\s*)?\d+(\s*(of|\/)\s*\d+)?$/i.test(l.text)) return false;
          return !(edge.indexOf(l)>=0 && raw.length>=3 && counts[key(l.text)]>=limit);
        });
      });
      var pages=[], textChars=0;
      raw.forEach(function(p){
        var c=pdfPageContent(p.lines), body=parasToBody(c.paras), plain=(c.heading+" "+body).replace(/\*\*/g,"").trim();
        textChars+=plain.length;
        var asPicture = opts.pdfMode==="picture" || (opts.pdfMode==="auto" && (p.landscape || plain.length<20));
        if(asPicture){
          pages.push({heading:c.heading||"Page "+p.n, body:"", imgs:[{pdfPage:p.n, alt:plain.replace(/\s+/g," ").slice(0,300)}]});
        } else {
          var prev=pages[pages.length-1];
          if(!c.heading && prev && !prev.imgs.length && body){
            // no heading on this page: carry on the previous page, rejoining a sentence split by the page break
            var firstPlain=c.paras[0] && !c.paras[0].bullet && !/^\*\*/.test(c.paras[0].t);
            prev.body += (firstPlain && prev.body && !/[.!?:;"”)]$/.test(prev.body) ? " " : "\n\n") + body;
          } else if(body || c.heading){
            pages.push({heading:c.heading||"Page "+p.n, body:body, imgs:[]});
          }
        }
      });
      return {title:"", pages:pages, pdf:pdf, scanned: textChars<20*raw.length && opts.pdfMode==="text", pageCount:n};
    });
  });
}
function renderPdfPage(pdf, n){
  return pdf.getPage(n).then(function(pg){
    var v1=pg.getViewport({scale:1}), v=pg.getViewport({scale:Math.min(2.5, 1600/v1.width)});
    var c=document.createElement("canvas"); c.width=Math.floor(v.width); c.height=Math.floor(v.height);
    var ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
    return pg.render({canvasContext:ctx, viewport:v}).promise.then(function(){ var u=c.toDataURL("image/jpeg",0.82); c.width=c.height=0; return u; });
  });
}

function readOffice(file, opts, onStatus){
  var name=file.name||"", low=name.toLowerCase();
  if(/\.(doc|ppt)$/.test(low)) return Promise.reject(new Error("This is an older ."+low.split(".").pop()+" file. Open it in Word or PowerPoint and use Save As → ."+low.split(".").pop()+"x, then import that."));
  if(/\.pdf$/.test(low)){
    return parsePdf(file, opts, onStatus).then(function(res){
      res.kind="pdf"; res.skippedImages=0;
      res.loadImg=function(img){ return renderPdfPage(res.pdf, img.pdfPage); };
      var fallback=name.replace(/\.[^.]+$/,"").replace(/[_-]+/g," ");
      return res.pdf.getMetadata().then(function(m){ var t=m && m.info && m.info.Title; res.title=(t && String(t).trim()) || fallback; return res; }, function(){ res.title=fallback; return res; });
    });
  }
  if(!/\.(docx|pptx|docm|pptm)$/.test(low)) return Promise.reject(new Error("Choose a Word (.docx), PowerPoint (.pptx) or PDF file."));
  return JSZip.loadAsync(file).catch(function(){ throw new Error("That file could not be opened. It may be damaged or password protected."); }).then(function(zip){
    return (/\.ppt[xm]$/.test(low) ? parsePptx(zip,name,opts) : parseDocx(zip,name)).then(function(res){
      res.zip=zip; res.kind=/\.ppt[xm]$/.test(low)?"pptx":"docx";
      res.loadImg=function(img){ return loadImage(zip, img.path).then(function(li){ return li ? shrinkImage(li.blob) : null; }); };
      return res;
    });
  });
}

document.getElementById("btn-import").addEventListener("click",function(){
  var layer=document.getElementById("layer"), parsed=null, chosen=null;
  layer.innerHTML='<div class="overlay" role="dialog" aria-modal="true" aria-labelledby="im-h"><div class="dialog">'+
    '<h3 id="im-h">Import Word, PowerPoint or PDF</h3>'+
    '<p class="hint" style="margin:0">PowerPoint: each slide becomes a page, with its title, text and main picture. Word: each top-level heading (Heading 1) starts a new page. PDF: see the option below. Everything is read here in your browser.</p>'+
    '<div class="opts-grid">'+
      '<label class="check"><input type="radio" name="im-mode" value="replace" checked><span><b>Start a new course</b> from this file (replaces the current pages and quiz)</span></label>'+
      '<label class="check"><input type="radio" name="im-mode" value="append"><span><b>Add the pages</b> to the end of the current course</span></label>'+
      '<label class="check"><input type="checkbox" id="im-notes"><span><b>Include speaker notes</b> in the page text (PowerPoint)</span></label>'+
      '<label class="f"><span>PDF pages</span><select id="im-pdfmode">'+
        '<option value="auto">Automatic: landscape pages (slides) as pictures, portrait pages as text</option>'+
        '<option value="picture">Every page as a picture: keeps the exact look</option>'+
        '<option value="text">Text only: editable and easy to read on phones</option>'+
      '</select></label>'+
    '</div>'+
    '<label class="btn" style="justify-self:start">Choose a file…<input type="file" id="im-file" hidden accept=".docx,.pptx,.docm,.pptm,.pdf,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.openxmlformats-officedocument.presentationml.presentation"></label>'+
    '<div class="status" id="im-status" role="status" style="margin-top:12px"></div>'+
    '<div id="im-result"></div>'+
    '<div class="dialog-actions"><button class="btn" type="button" id="im-cancel">Cancel</button><button class="btn primary" type="button" id="im-go" disabled>Import pages</button></div>'+
  '</div></div>';
  var d=layer.querySelector(".dialog"), status=d.querySelector("#im-status"), out=d.querySelector("#im-result"), go=d.querySelector("#im-go");
  d.querySelector("#im-cancel").addEventListener("click",closeLayer);
  function read(){
    if(!chosen) return;
    parsed=null; go.disabled=true; out.innerHTML=""; status.textContent="Reading "+chosen.name+"…";
    var me=chosen;
    readOffice(chosen,{notes:d.querySelector("#im-notes").checked, pdfMode:d.querySelector("#im-pdfmode").value}, function(msg){ if(me===chosen) status.textContent=msg; }).then(function(res){
      if(me!==chosen) return;
      parsed=res;
      if(!res.pages.length){ status.textContent = res.kind==="pdf" ? "No text was found in that PDF. It may be scanned. Choose \"Every page as a picture\" instead." : "No text or pictures were found in that file."; return; }
      var imgs=res.pages.reduce(function(n,p){ return n+p.imgs.length; },0);
      var bits=[res.pages.length+" page"+(res.pages.length===1?"":"s"), imgs+" picture"+(imgs===1?"":"s")];
      status.innerHTML="Found <b>"+bits.join("</b> and <b>")+"</b> in "+esc(chosen.name)+".";
      var notes=[];
      if(res.skippedImages) notes.push(res.skippedImages+" picture"+(res.skippedImages===1?" is":"s are")+" in a format browsers cannot show (such as EMF or TIFF) and will be left out.");
      if(res.hiddenSlides) notes.push(res.hiddenSlides+" hidden slide"+(res.hiddenSlides===1?" was":"s were")+" skipped.");
      if(res.kind==="pdf" && res.scanned) notes.push("Very little text was found. If this PDF is a scan, choose \"Every page as a picture\" instead.");
      if(res.kind==="pdf" && res.pages.some(function(p){ return !p.imgs.length; })) notes.push("PDF text comes across without its original layout. Check headings and paragraphs on each page after importing.");
      if(res.kind==="docx" && res.pages.length===1) notes.push("No headings were found, so everything went onto one page. Use Heading 1 styles in Word to split it into pages, or split it here after importing.");
      out.innerHTML='<ol class="imp-list">'+res.pages.map(function(p,i){
        var words=(p.body.match(/\S+/g)||[]).length;
        return '<li><span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="t">'+esc(p.heading)+'</span><span class="m">'+words+'w'+(p.imgs.length?' · img':'')+'</span></li>';
      }).join("")+'</ol>'+(notes.length?'<div class="issues">'+notes.map(esc).join("<br>")+'</div>':'');
      go.disabled=false; go.textContent="Import "+res.pages.length+" page"+(res.pages.length===1?"":"s");
    }).catch(function(err){ status.textContent=err && err.message ? err.message : "That file could not be read."; });
  }
  d.querySelector("#im-file").addEventListener("change",function(e){ chosen=e.target.files[0]||null; e.target.value=""; read(); });
  d.querySelector("#im-notes").addEventListener("change",function(){ if(chosen && /\.ppt[xm]$/i.test(chosen.name)) read(); });
  d.querySelector("#im-pdfmode").addEventListener("change",function(){ if(chosen && /\.pdf$/i.test(chosen.name)) read(); });
  go.addEventListener("click",function(){
    if(!parsed) return;
    go.disabled=true;
    var mode=d.querySelector('input[name="im-mode"]:checked').value;
    var total=parsed.pages.reduce(function(n,p){ return n+p.imgs.length; },0), done=0;
    var jobs=parsed.pages.reduce(function(pr,p){
      return pr.then(function(acc){
        var img=p.imgs[0];
        var page={id:uid("p"), heading:p.heading, blocks: p.body.trim() ? [{id:uid("b"),type:"text",body:p.body}] : []};
        if(!img){ acc.push(page); return acc; }
        status.textContent="Preparing pictures "+(++done)+" of "+total+"…";
        return parsed.loadImg(img)
          .then(function(url){ page.blocks.push({id:uid("b"),type:"image",image:url,imageAlt:img.alt||"",imagePos:"standard"}); acc.push(page); return acc; },
                function(){ acc.push(page); return acc; });
      });
    }, Promise.resolve([]));
    jobs.then(function(pages){
      if(mode==="replace"){
        var oldKeys=allVideos().filter(function(v){ return v.kind==="file"; }).map(function(v){ return v.key; });
        state.pages=pages; state.quiz=[]; state.title=parsed.title||state.title; state.example=false;
        oldKeys.forEach(forgetVideo);
        sel={type:"page", idx:0};
      } else {
        var at=state.pages.length; state.pages=state.pages.concat(pages); sel={type:"page", idx:at};
      }
      touched(); closeLayer(); render();
      toast("Imported "+pages.length+" page"+(pages.length===1?"":"s")+". Check each one, then add your quiz.");
    });
  });
});

/* ---------- project save / open ---------- */
document.getElementById("btn-save").addEventListener("click",function(){
  var btn=this;
  var data=JSON.parse(JSON.stringify(state)); delete data.example; data.app="scorm-studio"; data.saved=new Date().toISOString();
  var z=new JSZip(); z.file("project.json", JSON.stringify(data,null,2));
  state.pages.forEach(function(p){ videoBlocksOf(p).forEach(function(b){ if(b.video.kind==="file" && videoStore[b.video.key]) z.file("videos/"+b.video.key, videoStore[b.video.key], {compression:"STORE"}); }); });
  btn.disabled=true;
  z.generateAsync({type:"blob",compression:"DEFLATE"}).then(function(blob){
    return saveFile(slug(state.title)+".scorm-project.zip", blob);
  }).then(function(ok){ if(ok) toast("Project saved. Open it here later to keep editing."); })
  .catch(function(){ toast("The project could not be packed."); })
  .then(function(){ btn.disabled=false; });
});
document.getElementById("btn-open").addEventListener("click",function(){ document.getElementById("file-open").click(); });
function applyProject(d, blobs, fname){
  if(!d || !Array.isArray(d.pages) || !Array.isArray(d.quiz)) throw new Error("bad");
  delete d.app; delete d.saved;
  d.pages.forEach(function(p){
    p.id=p.id||uid("p"); p.heading=p.heading||"";
    pageVideosRaw(p).forEach(function(v){
      if(v.kind==="file" && blobs[v.key]){ var b=blobs[v.key]; videoStore[v.key]=b; idb.put(v.key,b); }
    });
  });
  d.quiz.forEach(function(q){ q.id=q.id||uid("q"); if(!q.type){ q.options=q.options||["",""]; q.correct=q.correct||0; } });
  state=ensureDesign(Object.assign(exampleCourse(), d)); state.example=false; persist(); sel={type:"settings",idx:0}; render(); restoreVideos(); toast("Opened "+fname);
}
document.getElementById("file-open").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return; e.target.value="";
  var fail=function(){ toast("That file is not a SCORM Studio project."); };
  if(/\.zip$/i.test(f.name)){
    JSZip.loadAsync(f).then(function(z){
      var pj=z.file("project.json"); if(!pj) throw new Error("no project");
      return pj.async("string").then(function(txt){
        var d=JSON.parse(txt), blobs={}, jobs=[];
        (d.pages||[]).forEach(function(p){
          pageVideosRaw(p).forEach(function(v){
            if(v.kind==="file"){ var vf=z.file("videos/"+v.key);
              if(vf) jobs.push(vf.async("blob").then(function(b){ blobs[v.key]=new Blob([b],{type:v.type||"video/mp4"}); })); }
          });
        });
        return Promise.all(jobs).then(function(){ applyProject(d, blobs, f.name); });
      });
    }).catch(fail);
  } else {
    var r=new FileReader();
    r.onload=function(){ try{ applyProject(JSON.parse(r.result), {}, f.name); }catch(err){ fail(); } };
    r.readAsText(f);
  }
});

render();
restoreVideos();
})();
</script>
