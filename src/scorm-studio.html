<style>
/* Layout: slim tool bar, outline rail on the left, one editor panel on the right; stacks on phones */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --sunk:#E8EEEB; --line:#D3DDD8;
  --ink:#16221E; --muted:#56655F; --accent:#1F6F5C; --accent-ink:#FFFFFF;
  --accent-soft:#DCEDE6; --marker:#C98A1E; --danger:#B3402F; --ok:#2E7D4F;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101715; --surface:#17211E; --sunk:#0C1210; --line:#2A3833;
  --ink:#E4ECE8; --muted:#97A8A1; --accent:#5DBB9E; --accent-ink:#08130F;
  --accent-soft:#1D3A31; --marker:#E2B04F; --danger:#E7816F; --ok:#6FCB94; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715; --surface:#17211E; --sunk:#0C1210; --line:#2A3833;
  --ink:#E4ECE8; --muted:#97A8A1; --accent:#5DBB9E; --accent-ink:#08130F;
  --accent-soft:#1D3A31; --marker:#E2B04F; --danger:#E7816F; --ok:#6FCB94; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.bar{border-bottom:1px solid var(--line);background:var(--surface)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0}
.brand .tag{font-family:var(--mono);font-size:12px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);border-color:var(--line)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* package strip */
.strip{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px;padding-block:12px}
.strip b{color:var(--ink);font-weight:500}

/* main grid */
.main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;padding-block:8px 48px}
@media (max-width:820px){.main{grid-template-columns:minmax(0,1fr)}}

.rail{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail h2{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 10px;cursor:pointer;min-width:0}
.nav-item:hover{background:var(--sunk)}
.nav-item.on{background:var(--surface);border-color:var(--line);box-shadow:0 1px 0 var(--line)}
.nav-item .n{font-family:var(--mono);font-size:12px;color:var(--muted);width:22px;flex:none;font-variant-numeric:tabular-nums}
.nav-item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav-item.on .n{color:var(--accent)}
.add{margin-top:6px}

/* editor */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;min-width:0}
@media (max-width:520px){.panel{padding:18px}}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:20px}
.panel-head h2{font-family:var(--display);font-weight:700;font-size:24px;margin:0;margin-right:auto;text-wrap:balance}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--marker);display:block;margin-bottom:2px}
.fields{display:grid;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:600px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:6px;min-width:0}
label.f > span{font-weight:600;font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{min-height:180px;resize:vertical;line-height:1.55}
textarea.short{min-height:80px}
input[type=color]{width:48px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:3px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink)}

.img-box{border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.img-box img{max-width:180px;max-height:120px;border-radius:6px;object-fit:cover}
.img-box video{width:240px;max-width:100%;border-radius:6px;background:#000}
.hs-editor{position:relative;display:inline-block;max-width:100%;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.hs-editor img{display:block;max-width:100%;max-height:380px;user-select:none;-webkit-user-drag:none}
.hs-draw{position:absolute;inset:0;cursor:crosshair}
.hs-zone{position:absolute;border:2px solid var(--marker);background:rgba(201,138,30,.15);border-radius:3px}
.hs-zone.correct{border-color:var(--ok);background:rgba(46,125,79,.18)}
.hs-zone.drawing{border-style:dashed}
.link-row{display:flex;gap:8px;flex:1;min-width:220px}
.link-row input{flex:1;min-width:0}
.vmeta{display:grid;gap:8px;flex:1;min-width:200px}
.vname{font-family:var(--mono);font-size:12.5px;word-break:break-all}
.warn{font-size:13px;color:var(--danger)}
.or{font-size:12.5px;color:var(--muted)}

/* quiz */
.q{border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;background:var(--bg)}
.q-top{display:flex;align-items:center;gap:8px}
.q-top .eyebrow{margin:0;margin-right:auto}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.opt input[type=radio]{accent-color:var(--ok);width:18px;height:18px}
.opt.correct input[type=text]{border-color:var(--ok)}
.qlist{display:grid;gap:14px}
.kc{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px;background:var(--bg)}
.kc.on{border-color:var(--accent);background:var(--accent-soft)}
.kc .q{background:var(--surface)}
/* design panel */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.theme{border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;background:var(--surface);text-align:left;display:grid}
.theme:hover{border-color:var(--accent)}
.theme.on{outline:2px solid var(--accent);outline-offset:1px}
.theme .sw{height:54px;display:flex;align-items:flex-end;gap:6px;padding:8px}
.theme .sw i{display:block;border-radius:4px}
.theme .nm{padding:7px 10px;font-size:13px;font-weight:600;border-top:1px solid var(--line)}
.colours{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.colour{display:flex;gap:10px;align-items:center;min-width:0}
.colour span{display:grid;font-size:13.5px;font-weight:600;min-width:0}
.colour span small{font-weight:400;color:var(--muted);font-size:12px}
.design-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:1100px){.design-grid{grid-template-columns:minmax(0,1fr)}}
.design-preview{position:sticky;top:12px;display:grid;gap:8px}
.design-preview .frame{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);height:520px}
.design-preview iframe{border:0;width:100%;height:100%;display:block}
.dsec{display:grid;gap:12px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.warnline{font-size:12.5px;color:var(--danger)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatch:hover{box-shadow:0 0 0 2px var(--accent)}
.gen{border:1px solid var(--accent);background:var(--accent-soft);border-radius:12px;padding:18px;display:grid;gap:14px;margin-bottom:22px}
.gen h3{font-family:var(--display);font-size:18px;margin:0}
.gen-row{display:flex;flex-wrap:wrap;gap:14px;align-items:end}
.gen-row label.f{flex:1;min-width:140px}
.gen-row label.f.wide{flex:3;min-width:220px}
.gen select,.gen input[type=text]{background:var(--surface)}
.gen-out{display:grid;gap:10px}
.gq{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.gq input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:18px;height:18px}
.gq .qt{font-weight:600}
.gq ul{margin:6px 0 0;padding-left:18px;font-size:14px}
.gq li.ok{color:var(--ok);font-weight:600}
.gq .src{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
.gq .fbk{font-size:13px;color:var(--muted);margin-top:4px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* export dialog + preview */
.overlay{position:fixed;inset:0;background:rgba(10,16,14,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:24px;max-height:100%;overflow:auto}
.dialog h3{font-family:var(--display);font-size:21px;margin:0 0 6px}
.issues{margin:12px 0;padding:12px 14px;border-radius:8px;background:var(--sunk);font-size:14px}
.issues li{margin:4px 0}
.issues.bad{border-left:3px solid var(--danger)}
.issues.good{border-left:3px solid var(--ok)}
.filelist{font-family:var(--mono);font-size:12.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:12px 0;overflow-x:auto;white-space:pre}
.dialog-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.imp-list{margin:12px 0;padding:0;list-style:none;border:1px solid var(--line);border-radius:8px;max-height:260px;overflow:auto;background:var(--bg)}
.imp-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline}
.imp-list li:last-child{border-bottom:0}
.imp-list .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.imp-list .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.imp-list .m{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.opts-grid{display:grid;gap:10px;margin:14px 0}
.status{font-size:14px;color:var(--muted);min-height:1.5em}
.draft-box{display:grid;gap:10px}
.draft-preview-wrap{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.draft-preview{white-space:pre-wrap;font-size:14px;max-height:280px;overflow:auto}
.steps{padding-left:20px;margin:8px 0;font-size:14px}
.steps li{margin:3px 0}

.preview{background:var(--surface);border-radius:14px;width:100%;max-width:1100px;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
.preview-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.preview-bar strong{margin-right:auto;font-family:var(--display)}
.frame-wrap{flex:1;background:var(--sunk);display:flex;justify-content:center;overflow:auto;min-height:0}
.frame-wrap iframe{border:0;width:100%;height:100%;background:#fff;transition:max-width .2s}
.frame-wrap.phone iframe{max-width:390px;border-left:1px solid var(--line);border-right:1px solid var(--line)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.example{display:inline-block;font-family:var(--mono);font-size:11.5px;color:var(--marker);border:1px solid var(--marker);border-radius:99px;padding:1px 8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="brand"><h1>SCORM Studio</h1><span class="tag">for Bridge</span></div>
    <div class="actions">
      <button class="btn ghost" id="btn-import" type="button" title="Import a Word, PowerPoint or PDF file">Import file</button>
      <button class="btn ghost" id="btn-open" type="button">Open project</button>
      <button class="btn ghost" id="btn-save" type="button">Save project</button>
      <button class="btn" id="btn-preview" type="button">Preview course</button>
      <button class="btn primary" id="btn-export" type="button">Download SCORM .zip</button>
      <input type="file" id="file-open" accept=".zip,.json,application/zip,application/json" hidden>
    </div>
  </div>
</header>

<div class="wrap"><div class="strip" id="strip"></div></div>

<div class="wrap main">
  <aside class="rail">
    <div>
      <h2>Course</h2>
      <div class="nav"><button class="nav-item" data-sel="settings" type="button"><span class="n">⚙</span><span class="t">Settings</span></button>

    </div>
    <div>
      <h2>Pages</h2>
      <div class="nav" id="nav-pages"></div>
      <button class="btn small add" id="add-page" type="button">+ Add page</button>
    </div>

      <h2>Assessment</h2>
      <div class="nav"><button class="nav-item" data-sel="quiz" type="button"><span class="n">?</span><span class="t" id="nav-quiz-label">Quiz</span></button></div>
    </div>
  </aside>
  <main class="panel" id="editor"></main>
</div>

   TEAM SETTINGS  (edit these lines in Notepad / TextEdit before sharing)

   proxyUrl   - web address of your quiz server, for example

   accessCode - the ACCESS_CODE you set on the quiz server
   apiKey     - ONLY for testing on your own computer. Anyone who opens a file

  playfair:    {label:"Playfair Display (serif)", stack:"'Playfair Display', Georgia, serif", g:"Playfair+Display:wght@600;700"}
};

function defaultDesign(accent){
  var t=THEMES.clean;
  return {theme:"clean", accent:accent||t.accent, bg:t.bg, card:t.card, text:t.text, headingFont:t.headingFont, bodyFont:t.bodyFont,
    header:t.header, width:"standard", corners:t.corners, textSize:"standard", logo:null, logoAlt:"", cover:false, coverImage:null, coverButton:"Start course"};
}
function ensureDesign(s){
  if(!s) return s;
  var d=defaultDesign(s.accent), cur=s.design||{};
  Object.keys(d).forEach(function(k){ if(cur[k]===undefined) cur[k]=d[k]; });
  if(!FONTS[cur.headingFont]) cur.headingFont="system";
  if(!FONTS[cur.bodyFont]) cur.bodyFont="system";
  s.design=cur; s.accent=cur.accent;
  (s.pages||[]).forEach(migratePageToBlocks);
  if(s.showBadge===undefined) s.showBadge=true;
  function ensureQType(q){ if(!q.type) q.type="mc"; }
  (s.quiz||[]).forEach(ensureQType);
  (s.pages||[]).forEach(function(p){ if(p.check) (p.check.questions||[]).forEach(ensureQType); });
  return s;
}
// A page used to be one fixed heading+body+image+video+keyPoint shape. Pages are now a heading
// plus an ordered list of typed blocks (text/image/video/quote/keypoint), for more layout freedom.
// This converts anything still in the old shape, once, the first time it's loaded.
function migratePageToBlocks(p){
  if(p.blocks) return;
  var blocks=[];
  var imgBlock = p.image ? {id:uid("b"), type:"image", image:p.image, imageAlt:p.imageAlt||"", imagePos: p.imagePos==="banner"?"banner":"standard"} : null;
  var textBlock = (p.body && p.body.trim()) ? {id:uid("b"), type:"text", body:p.body} : null;
  if(imgBlock && p.imagePos==="below"){
    if(textBlock) blocks.push(textBlock);
    blocks.push(imgBlock);
  } else {
    // above, left, right, banner (or no body): image first. left/right had no text-wrap equivalent
    // in a block stack, so they're approximated as image-then-text, same as above/banner.
    if(imgBlock) blocks.push(imgBlock);
    if(textBlock) blocks.push(textBlock);
  }
  if(p.keyPoint && p.keyPoint.trim()) blocks.push({id:uid("b"), type:"keypoint", text:p.keyPoint, tone:p.callout||"brand"});
  if(p.video) blocks.push({id:uid("b"), type:"video", video:p.video});
  p.blocks=blocks;
  delete p.body; delete p.image; delete p.imageAlt; delete p.imagePos; delete p.keyPoint; delete p.callout; delete p.video;
}
function hexToRgb(h){ var m=String(h||"").replace("#","").match(/^([0-9a-f]{6})$/i); if(!m) return [0,0,0]; var n=parseInt(m[1],16); return [n>>16&255,n>>8&255,n&255]; }
function luminance(h){ return hexToRgb(h).map(function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }).reduce(function(a,v,i){ return a+v*[0.2126,0.7152,0.0722][i]; },0); }
function contrastRatio(a,b){ var x=luminance(a), y=luminance(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); }
function onColour(bg){ return contrastRatio(bg,"#FFFFFF") >= contrastRatio(bg,"#111111") ? "#FFFFFF" : "#111111"; }

/* ---------- video files: kept in memory and in this browser's IndexedDB ---------- */
var videoStore = {};
var idb = (function(){
  var dbp=null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise(function(res){
      try{ var r=indexedDB.open("scorm-studio",1);
        r.onupgradeneeded=function(){ r.result.createObjectStore("videos"); };
        r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ res(null); };
      }catch(e){ res(null); }
    });
    return dbp;
  }
  function tx(mode,fn){
    return open().then(function(db){
      if(!db) return null;
      return new Promise(function(res){
        try{ var t=db.transaction("videos",mode), req=fn(t.objectStore("videos"));
          t.oncomplete=function(){ res(req && req.result); }; t.onerror=function(){ res(null); }; t.onabort=function(){ res(null); };
        }catch(e){ res(null); }
      });
    });
  }
  return {
    put:function(k,b){ return tx("readwrite",function(s){ return s.put(b,k); }); },
    get:function(k){ return tx("readonly",function(s){ return s.get(k); }); },
    del:function(k){ return tx("readwrite",function(s){ return s.delete(k); }); }
  };
})();
function videoBlocksOf(p){ return (p.blocks||[]).filter(function(b){ return b.type==="video" && b.video; }); }
// Like videoBlocksOf, but also understands a page that hasn't been through migratePageToBlocks yet
// (e.g. a .scorm-project.zip saved by an older version, mid-way through being opened).
function pageVideosRaw(p){
  if(Array.isArray(p.blocks)) return videoBlocksOf(p).map(function(b){ return b.video; });
  return p.video ? [p.video] : [];
}
function allVideos(){
  var out=[];
  state.pages.forEach(function(p){ videoBlocksOf(p).forEach(function(b){ out.push(b.video); }); });
  return out;
}
function restoreVideos(){
  var keys = allVideos().filter(function(v){ return v.kind==="file" && !videoStore[v.key]; }).map(function(v){ return v.key; });
  if(!keys.length) return;
  Promise.all(keys.map(function(k){ return idb.get(k).then(function(b){ if(b) videoStore[k]=b; }); })).then(function(){ render(); });
}
function forgetVideo(key){
  if(!key) return;
  var used = allVideos().some(function(v){ return v.key===key; });
  if(!used){ delete videoStore[key]; idb.del(key); }
}
function parseVideoLink(u){
  var m; u=String(u||"").trim();
  if((m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))) return {kind:"embed", url:u, src:"https://www.youtube-nocookie.com/embed/"+m[1]+"?rel=0", site:"YouTube"};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return {kind:"embed", url:u, src:"https://player.vimeo.com/video/"+m[1], site:"Vimeo"};
  if(/^https:\/\/\S+\.(mp4|webm|m4v)(\?\S*)?$/i.test(u)) return {kind:"remote", url:u, src:u, site:"Direct link"};
  return null;
}
function fmtSize(b){ return b>1048576 ? (b/1048576).toFixed(1)+" MB" : Math.max(1,Math.round(b/1024))+" KB"; }
function videoExt(v){ var m=(v.name||"").match(/\.([a-z0-9]{2,4})$/i); if(m) return m[1].toLowerCase(); return ({"video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"})[v.type]||"mp4"; }

var BLOCK_TYPES = [["text","Text"],["image","Image"],["video","Video"],["quote","Quote"],["keypoint","Key point"]];
function blockTypeLabel(type){ var m=BLOCK_TYPES.filter(function(t){ return t[0]===type; })[0]; return m?m[1]:type; }
function newBlock(type){

  if(type==="video") return {id:id, type:"video", video:null};

var DRAFT_MODES=[["expand","Expand with more detail"],["tighten","Tighten (shorter, clearer)"],["simplify","Simplify the language"],["polish","Polish grammar & spelling"]];
/* Asks Claude to rewrite a text block's content. Never overwrites `b.body` itself - the
   result sits in a preview until the author clicks "Use this", same check-before-you-add
   approach as the quiz generator. */
function draftBox(b, p, ta){
  var box=el('<div class="draft-box"></div>');
  var st={open:false, mode:"expand", instruction:"", busy:false, error:"", result:null, ctrl:null};
  function paint(){
    box.innerHTML = st.open ? (
      '<div class="gen-row">'+
        '<label class="f"><span>Mode</span><select id="dr-mode">'+DRAFT_MODES.map(function(m){ return '<option value="'+m[0]+'"'+(m[0]===st.mode?' selected':'')+'>'+m[1]+'</option>'; }).join("")+'</select></label>'+
        '<label class="f wide"><span>Also <span class="hint">optional</span></span><input type="text" id="dr-inst" placeholder="e.g. keep it under 100 words"></label>'+
      '</div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn small primary" type="button" id="dr-go"></button>'+
        '<button class="btn small ghost" type="button" id="dr-close">Close</button><span class="status" id="dr-status"></span></div>'+
      '<div id="dr-out"></div>'
    ) : '<button class="btn small ghost" type="button" id="dr-open">Draft with AI</button>';
    if(!st.open){ box.querySelector("#dr-open").addEventListener("click",function(){ st.open=true; paint(); }); return; }
    box.querySelector("#dr-close").addEventListener("click",function(){ if(st.ctrl) st.ctrl.abort(); st.open=false; st.result=null; st.error=""; paint(); });
    var modeSel=box.querySelector("#dr-mode"); modeSel.addEventListener("change",function(){ st.mode=modeSel.value; });
    var instInp=box.querySelector("#dr-inst"); instInp.value=st.instruction; instInp.addEventListener("input",function(){ st.instruction=instInp.value; });
    var go=box.querySelector("#dr-go"), status=box.querySelector("#dr-status"), out=box.querySelector("#dr-out");
    if(st.busy){ go.textContent="Stop"; go.classList.remove("primary"); status.innerHTML='<span class="spin" aria-hidden="true"></span>Drafting. This usually takes 10 to 20 seconds.'; }
    else { go.textContent="Draft with AI"; go.classList.add("primary"); status.textContent=st.error||""; }
    if(st.result!=null && !st.busy){
      var pv=el('<div class="draft-preview-wrap"><div class="draft-preview"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn small ghost" type="button" id="dr-discard">Discard</button><button class="btn small primary" type="button" id="dr-use">Use this</button></div></div>');
      pv.querySelector(".draft-preview").textContent=st.result;
      out.appendChild(pv);
      pv.querySelector("#dr-discard").addEventListener("click",function(){ st.result=null; paint(); });
      pv.querySelector("#dr-use").addEventListener("click",function(){ b.body=st.result; ta.value=st.result; touched(); st.result=null; st.open=false; paint(); toast("Page text updated"); });
    }
    go.addEventListener("click",function(){
      if(st.busy){ if(st.ctrl) st.ctrl.abort(); return; }
      if((b.body||"").trim().length<10){ st.error="Write a short note first, then let Claude develop it into full text."; paint(); return; }
      st.busy=true; st.error=""; st.result=null; paint();
      st.ctrl=new AbortController();
      var req={title:state.title, heading:p.heading, body:b.body, mode:st.mode, instruction:st.instruction.trim()};
      writeDraft(req, st.ctrl.signal).then(function(text){ st.result=text; }).catch(function(err){
        var c=err && err.code;
        if(c==="cancelled" || (err && err.name==="AbortError")) st.error="Stopped.";
        else if(c==="not_setup"){ st.error=""; openAiSettings(); }
        else if(c==="not_granted" || c==="sampling_disabled" || c==="not_declared") st.error="Drafting needs permission to ask Claude, which was not given. Allow it when asked, or set up question writing in Settings.";
        else if(c==="bad_code") st.error="The quiz server did not accept the access code. Check it in Question writing settings.";
        else if(c==="bad_key") st.error="The API key was not accepted. Check it in Question writing settings.";
        else if(c==="no_credit") st.error="The Claude account behind drafting has run out of credit. Ask whoever set it up to top it up.";
        else if(c==="rate_limited") st.error=err.message || "Too many requests just now. Wait a minute and try again.";
        else if(c==="unreachable") st.error="Could not reach the quiz server. Check the internet connection and the server address in Question writing settings.";
        else if(c==="invalid_json") st.error="The reply could not be read. Try again.";
        else st.error="Text could not be drafted ("+(c||"error")+"). Try again in a moment.";
      }).then(function(){ st.busy=false; st.ctrl=null; paint(); });
    });
  }
  paint();
  return box;
}
function blockEditor(b, p, redraw){
  var c=el('<div class="q"></div>');

   '<div class="q-top"><span class="eyebrow">'+blockTypeLabel(b.type)+'</span>'+
   '<button class="btn small" type="button" data-a="up" aria-label="Move block up">↑</button>'+

  var box=c.querySelector("#bb-"+b.id);
  if(b.type==="text"){
    box.appendChild(el('<label class="f"><span>Content <span class="hint">Blank line = new paragraph · start a line with "- " for a bullet · **bold**</span></span><textarea></textarea></label>'));
    var ta=box.querySelector("textarea"); ta.value=b.body||""; ta.addEventListener("input",function(){ b.body=ta.value; touched(); });

    box.appendChild(el('<label class="f"><span>Quote</span><textarea class="short"></textarea></label>'));
    box.appendChild(el('<label class="f"><span>Attribution <span class="hint">optional</span></span><input type="text"></label>'));

    ci.value=b.cite||""; ci.addEventListener("input",function(){ b.cite=ci.value; touched(); });
  } else if(b.type==="keypoint"){
    box.appendChild(el('<label class="f"><span>Key point</span><input type="text"></label>'));
    box.appendChild(el('<label class="f"><span>Style</span><select>'+
      '<option value="brand">Brand colour</option><option value="info">Information (blue)</option><option value="warning">Warning (amber)</option><option value="success">Good practice (green)</option><option value="danger">Important (red)</option>'+
      '</select></label>'));

    sel.value=b.tone||"brand"; sel.addEventListener("change",function(){ b.tone=sel.value; touched(); });
  }
  c.addEventListener("click",function(e){
    var a=e.target.closest("[data-a]"); if(!a) return;
    var arr=p.blocks, bi=arr.indexOf(b);

    else if(a.dataset.a==="down" && bi<arr.length-1){ arr.splice(bi+1,0,arr.splice(bi,1)[0]); touched(); redraw(); }
    else if(a.dataset.a==="del"){

        if(b.type==="video" && b.video && b.video.kind==="file") forgetVideo(b.video.key);
        arr.splice(bi,1); touched(); redraw();
      } else { a.dataset.armed="1"; a.textContent="Confirm delete"; setTimeout(function(){ delete a.dataset.armed; a.textContent="Delete"; },3500); }
    }
  });
  return c;
}

function pageText(p, i){
  var parts=["## Page "+(i+1)+": "+(p.heading||"Untitled")];
  (p.blocks||[]).forEach(function(b){
    if(b.type==="text" && b.body) parts.push(b.body.replace(/\*\*/g,""));
    else if(b.type==="quote" && b.text) parts.push("Quote: "+b.text+(b.cite?" — "+b.cite:""));
    else if(b.type==="keypoint" && b.text) parts.push("Key point: "+b.text);
    else if(b.type==="image" && b.imageAlt) parts.push("Picture shows: "+b.imageAlt);
  });
  return parts.join("\n");
}
function renderCheck(box, p, pageIdx){
  if(!p.check) p.check={on:false, mustPass:true, questions:[]};
  var c=p.check;
  box.innerHTML=
    '<div class="kc-head"><label class="check"><input type="checkbox" id="kc-on"><span><b>Knowledge check after this page</b><br>'+
      '<span class="hint">A few quick questions on their own screen before the next page. Not part of the final quiz score.</span></span></label></div>'+
    '<div id="kc-body" class="fields"></div>';
  var on=box.querySelector("#kc-on"), body=box.querySelector("#kc-body");
  on.checked=!!c.on;
  on.addEventListener("change",function(){
    c.on=on.checked;
    if(c.on && !c.questions.length) c.questions.push({id:uid("k"),q:"",options:["",""],correct:0,feedback:""});
    touched(); draw();
  });
  function draw(){
    body.hidden=!c.on; box.classList.toggle("on", !!c.on);
    if(!c.on){ body.innerHTML=""; return; }
    var branchOpts=function(selected){
      return '<option value="">Next page (normal)</option>'+state.pages.map(function(pg,i){
        if(pg===p) return "";
        return '<option value="'+pg.id+'"'+(selected===pg.id?' selected':'')+'>'+(i+1)+'. '+esc(pg.heading||"Untitled page")+'</option>';
      }).join("");
    };
    body.innerHTML=
      '<label class="check"><input type="checkbox" id="kc-must"><span><b>Must answer correctly to continue</b><br><span class="hint">Untick for practice only: learners see the answers and can carry on either way</span></span></label>'+
      '<div class="row2">'+
        '<label class="f"><span>If passed, go to</span><select id="kc-pass">'+branchOpts(c.branch&&c.branch.pass)+'</select></label>'+
        '<label class="f"><span>If not passed, go to <span class="hint">only used when "must answer correctly" is off</span></span><select id="kc-fail">'+branchOpts(c.branch&&c.branch.fail)+'</select></label>'+
      '</div>'+
      '<div class="qlist" id="kc-list"></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">'+
        '<button class="btn small" type="button" id="kc-add">+ Add question</button>'+
        '<button class="btn small" type="button" id="kc-gen">Write questions from this page</button>'+
        '<span class="status" id="kc-status"></span></div>';
    var must=body.querySelector("#kc-must"); must.checked=c.mustPass!==false;
    must.addEventListener("change",function(){ c.mustPass=must.checked; touched(); });
    if(!c.branch) c.branch={pass:null, fail:null};
    body.querySelector("#kc-pass").addEventListener("change",function(e){ c.branch.pass=e.target.value||null; touched(); });
    body.querySelector("#kc-fail").addEventListener("change",function(e){ c.branch.fail=e.target.value||null; touched(); });
    var list=body.querySelector("#kc-list");
    c.questions.forEach(function(q,qi){ list.appendChild(questionCard(q,qi,c.questions,draw)); });
    body.querySelector("#kc-add").addEventListener("click",function(){ c.questions.push({id:uid("k"),q:"",options:["",""],correct:0,feedback:""}); touched(); draw(); });
    var gb=body.querySelector("#kc-gen"), st=body.querySelector("#kc-status"), ctrl=null;
    gb.addEventListener("click",function(){
      if(ctrl){ ctrl.abort(); return; }
      var text=pageText(p,pageIdx);
      if(text.replace(/## Page \d+:.*\n?/,"").trim().length<80){ st.textContent="Add more text to this page first."; return; }
      ctrl=new AbortController(); gb.textContent="Stop"; st.innerHTML='<span class="spin" aria-hidden="true"></span>Writing questions…';
      var existing=c.questions.map(function(q){ return q.q; }).filter(Boolean);
      writeQuestions({title:state.title, content:text, count:2, level:"mixed", focus:"", existing:existing}, ctrl.signal).then(function(raw){
        var got=cleanGenerated(raw).filter(function(r){ return existing.indexOf(r.q)<0; });
        // replace a blank starter question rather than leaving it at the top
        c.questions=c.questions.filter(function(q){ return q.q.trim() || q.options.some(function(o){ return o.trim(); }); });
        got.forEach(function(r){ c.questions.push({id:uid("k"),q:r.q,options:r.options,correct:r.correct,feedback:r.feedback}); });
        touched(); ctrl=null; draw();
        var s2=box.querySelector("#kc-status"); if(s2) s2.textContent = got.length ? "Added "+got.length+" question"+(got.length===1?"":"s")+". Check them before publishing." : "No usable questions came back. Try again.";
      }).catch(function(err){
        var code=err && err.code; ctrl=null; gb.textContent="Write questions from this page";
        if(code==="not_setup") { st.textContent=""; openAiSettings(); }
        else if(code==="cancelled" || (err && err.name==="AbortError")) st.textContent="Stopped.";
        else if(code==="bad_code") st.textContent="The access code was not accepted.";
        else if(code==="unreachable") st.textContent="Could not reach the quiz server.";
        else if(code==="rate_limited") st.textContent=(err && err.message) || "Too many requests. Try again shortly.";
        else st.textContent="Questions could not be written ("+(code||"error")+").";
      });
    });
  }
  draw();
}

function shrinkImage(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onerror=rej;
    r.onload=function(){
      if(file.type==="image/gif"){ return res(r.result); }
      var im=new Image();
      im.onerror=rej;
      im.onload=function(){
        var max=1600, w=im.naturalWidth, h=im.naturalHeight;
        if(w<=max && file.size<600000){ return res(r.result); }
        var s=Math.min(1,max/w); var c=document.createElement("canvas"); c.width=Math.round(w*s); c.height=Math.round(h*s);
        var ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg",0.85));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

// Keep buildPrompt in step with the copy in quiz-server/server.js
function buildPrompt(req){
  var levels={easy:"straightforward recall of facts stated in the content", mixed:"a mix of simple recall and short practical scenarios", hard:"short realistic workplace scenarios where the learner must apply the guidance"};
  var existing=(req.existing||[]).map(function(q){ return "- "+q; }).join("\n");
  return "You are writing an assessment for a workplace e-learning course. Write exactly "+req.count+" multiple-choice questions based ONLY on the course content below.\n\n"+
"Rules:\n"+
"- Use only facts, rules and procedures that appear in the content. Do not add outside knowledge.\n"+
"- Questions should test "+(levels[req.level]||levels.mixed)+".\n"+
"- Each question has 4 answer options (3 if the content only supports 3), exactly one correct.\n"+
"- Wrong options must be plausible but clearly wrong according to the content. Do not use \"All of the above\" or \"None of the above\".\n"+
"- Keep questions and answers short and in plain British English.\n"+
"- Spread questions across the pages rather than repeating one point.\n"+
"- Feedback: one sentence explaining why the correct answer is right, based on the content.\n"+
(req.focus?"- Concentrate on: "+req.focus+"\n":"")+
(existing?"- Do not repeat or closely reword these existing questions:\n"+existing+"\n":"")+
"\nReply with ONLY a JSON array, no other text, in this shape:\n"+
'[{"question":"...","options":["...","...","...","..."],"correct":0,"feedback":"...","page":1}]\n'+
"\"correct\" is the zero-based index of the right option. \"page\" is the page number the question is based on.\n\n"+
"COURSE TITLE: "+req.title+"\n\nCOURSE CONTENT:\n"+req.content;
}
function parseQuestionsText(t){
  t=String(t||"").replace(/```(?:json)?/g,"");
  var a=t.indexOf("["), b=t.lastIndexOf("]");
  if(a<0 || b<a) throw {code:"invalid_json"};
  try{ return JSON.parse(t.slice(a,b+1)); }catch(e){ throw {code:"invalid_json"}; }
}
// Keep buildDraftPrompt in step with the copy in quiz-server/server.js
function buildDraftPrompt(req){
  var modes={
    expand:"Expand this into a fuller page, adding relevant detail while staying strictly accurate to what's already here. Do not invent facts, numbers, or policies not implied by the original text.",
    tighten:"Tighten this text: shorter and clearer, with no loss of meaning.",
    simplify:"Rewrite this in simpler, plainer language suitable for a general workplace audience.",
    polish:"Fix grammar, spelling and punctuation. Keep the meaning and tone exactly as written."
  };
  return "You are helping write a page of a workplace e-learning course. "+(modes[req.mode]||modes.expand)+"\n\n"+
"Rules:\n"+
"- Plain British English.\n"+
"- Output format: a blank line between paragraphs, lines starting with \"- \" for bullets, **double asterisks** for bold. No heading, title or extra commentary, just the replacement text.\n"+
"- Do not add a sign-off, summary line, or anything not asked for above.\n"+
(req.instruction?"- Also: "+req.instruction+"\n":"")+
"\nReply with ONLY a JSON object, no other text, in this shape:\n"+
'{"text":"..."}\n\n'+
"COURSE TITLE: "+req.title+"\nPAGE HEADING: "+req.heading+"\n\nCURRENT TEXT:\n"+req.body;

function parseDraftText(t){
  t=String(t||"").replace(/```(?:json)?/g,"");
  var a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a<0 || b<a) throw {code:"invalid_json"};

}

function httpError(status, body){
  var msg=(body && (body.error && body.error.message || body.message || body.error)) || "";
  if(typeof msg!=="string") msg="";
  if(status===401 || status===403) return {code: body && body.code==="bad_code" ? "bad_code" : "bad_key"};
  if(status===402 || /credit balance/i.test(msg)) return {code:"no_credit"};
  if(status===413) return {code:"too_large"};
  if(status===429) return {code:"rate_limited", message: (body && body.message) || "Too many requests just now. Wait a minute and try again."};
  return {code: (body && body.code) || ("http_"+status)};
}
function writeQuestions(req, signal){
  return aiRoute().then(function(r){
    if(!r) throw {code:"not_setup"};
    if(r.kind==="claude"){
      return r.sample.limits().catch(function(){ return null; }).then(function(lim){
        var cap=lim && lim.maxInputBytes ? Math.floor(lim.maxInputBytes*0.6) : 120000;
        if(req.content.length>cap) req.content=req.content.slice(0,cap)+"\n\n[content shortened]";
        return r.sample.json(buildPrompt(req),{modelTier:"default", signal:signal});
      });
    }
    if(req.content.length>150000) req.content=req.content.slice(0,150000)+"\n\n[content shortened]";
    var url, opts;
    if(r.kind==="proxy"){
      if(!r.s.accessCode) throw {code:"not_setup"};
      url=r.s.proxyUrl+"/generate";
      opts={method:"POST", signal:signal, headers:{"Content-Type":"application/json","X-Access-Code":r.s.accessCode}, body:JSON.stringify(req)};
    } else {
      url="https://api.anthropic.com/v1/messages";
      opts={method:"POST", signal:signal, headers:{"content-type":"application/json","x-api-key":r.s.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:r.s.model, max_tokens:4096, messages:[{role:"user", content:buildPrompt(req)}]})};
    }
    return fetch(url, opts).catch(function(e){ if(e && e.name==="AbortError") throw e; throw {code:"unreachable"}; }).then(function(res){
      return res.text().then(function(txt){
        var body=null; try{ body=JSON.parse(txt); }catch(e){}

    });
  });
}

function shuffleArr(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function cleanGenerated(raw){
  var arr = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.questions) ? raw.questions : []);
  var seen={};
  state.quiz.forEach(function(q){ seen[q.q.trim().toLowerCase()]=1; });
  return arr.map(function(x){
    if(!x || typeof x.question!=="string" || !Array.isArray(x.options)) return null;
    var opts=x.options.map(function(o){ return String(o||"").trim(); }).filter(Boolean).slice(0,6);
    var c=+x.correct;
    if(opts.length<2 || !(c>=0 && c<x.options.length)) return null;
    var right=String(x.options[c]).trim(); if(opts.indexOf(right)<0) return null;
    var key=x.question.trim().toLowerCase(); if(seen[key]) return null; seen[key]=1;
    // shuffle so the right answer is not always in the same place
    var mixed=shuffleArr(opts);
    return {q:x.question.trim(), options:mixed, correct:mixed.indexOf(right), feedback:String(x.feedback||"").trim(), page:+x.page||null, keep:true};
  }).filter(Boolean);
}

    });
    var bar=el('<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end"><button class="btn" type="button" id="gen-clear">Discard</button><button class="btn primary" type="button" id="gen-add"></button></div>');
    out.appendChild(bar);
    bar.querySelector("#gen-clear").addEventListener("click",function(){ gen.results=null; gen.error=""; paint(); });
    bar.querySelector("#gen-add").addEventListener("click",function(){
      var keep=gen.results.filter(function(r){ return r.keep; });
      keep.forEach(function(r){ state.quiz.push({id:uid("q"), q:r.q, options:r.options, correct:r.correct, feedback:r.feedback}); });

  }

  go.addEventListener("click",function(){
    if(gen.busy){ if(gen.ctrl) gen.ctrl.abort(); return; }
    if(textLen<150){ gen.error="Add more text to your pages first. Questions can only be written from what is on them."; paint(); return; }
    gen.busy=true; gen.error=""; gen.results=null; paint();
    gen.ctrl=new AbortController();
    var req={title:state.title, content:courseText(), count:gen.count, level:gen.level, focus:gen.focus.trim(), existing:state.quiz.map(function(q){ return q.q; })};
    writeQuestions(req, gen.ctrl.signal).then(function(raw){
      gen.results=cleanGenerated(raw);
    }).catch(function(err){
      var c=err && err.code;
      if(c==="cancelled" || (err && err.name==="AbortError")) gen.error="Stopped.";
      else if(c==="not_setup"){ gen.error=""; openAiSettings(); }
      else if(c==="prompt_too_large" || c==="too_large") gen.error="The course is too long to send in one go. Use the Focus box to narrow it down, or ask for fewer questions.";
      else if(c==="not_granted" || c==="sampling_disabled" || c==="not_declared") gen.error="Question writing needs permission to ask Claude, which was not given. Allow it when asked, or set up question writing in Settings.";
      else if(c==="bad_code") gen.error="The quiz server did not accept the access code. Check it in Question writing settings.";
      else if(c==="bad_key") gen.error="The API key was not accepted. Check it in Question writing settings.";
      else if(c==="no_credit") gen.error="The Claude account behind question writing has run out of credit. Ask whoever set it up to top it up.";
      else if(c==="rate_limited") gen.error=err.message || "Too many requests just now. Wait a minute and try again.";
      else if(c==="unreachable") gen.error="Could not reach the quiz server. Check the internet connection and the server address in Question writing settings.";
      else if(c==="invalid_json") gen.error="The reply could not be read. Try again, or ask for fewer questions.";
      else gen.error="Questions could not be generated ("+(c||"error")+"). Try again in a moment.";
    }).then(function(){ gen.busy=false; gen.ctrl=null; if(gen.repaint) gen.repaint(); });
  });
  slot.querySelector("#gen-setup").addEventListener("click", openAiSettings);
  aiRoute().then(function(r){ var s=slot.querySelector("#gen-via"); if(s) s.textContent = r ? r.label : "Not set up yet"; });
  gen.repaint = function(){ if(document.body.contains(slot)) paint(); };
  paint();
}

      var r=el('<div class="opt'+(q.correct===oi?' correct':'')+'"><input type="radio" name="c-'+q.id+'" aria-label="Mark as correct answer"><input type="text" placeholder="Answer '+(oi+1)+'"><button class="btn small ghost" type="button" aria-label="Remove answer">✕</button></div>');

      x.addEventListener("click",function(){ q.options.splice(oi,1); if(q.correct>=q.options.length) q.correct=q.options.length-1; else if(q.correct>oi) q.correct--; touched(); drawOpts(); });

  });

}
function ensureMatchShape(q){ if(!q.pairs || q.pairs.length<2) q.pairs=[{left:"",right:""},{left:"",right:""}]; }

function fillBlankCount(text){ var m=String(text||"").match(/_{3,}/g); return m?m.length:0; }
function ensureFillShape(q){ if(q.text==null) q.text=""; if(!q.answers) q.answers=[]; }

function ensureHotspotShape(q){ if(q.image===undefined) q.image=null; if(!q.zones) q.zones=[]; if(q.imageAlt==null) q.imageAlt=""; }
function hotspotEditor(q){
  ensureHotspotShape(q);
  var box=el('<div class="f" style="display:grid;gap:10px"></div>');
  function draw(){
    box.innerHTML="";
    if(!q.image){
      var lab=el('<label class="btn small">Choose image…<input type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden></label>');
      box.appendChild(lab); box.appendChild(el('<span class="hint">PNG, JPG, WebP or GIF. Draw boxes on it once chosen.</span>'));
      lab.querySelector("input").addEventListener("change",function(e){
        var f=e.target.files[0]; if(!f) return;
        shrinkImage(f).then(function(url){ q.image=url; touched(); draw(); }).catch(function(){ toast("That image could not be read. Try a JPG or PNG."); });
      });
      return;
    }
    var altRow=el('<label class="f"><span>Alt text <span class="hint">describes the image for screen readers</span></span><input type="text"></label>');
    box.appendChild(altRow);
    var altInp=altRow.querySelector("input"); altInp.value=q.imageAlt||"";
    altInp.addEventListener("input",function(){ q.imageAlt=altInp.value; touched(); });
    box.appendChild(el('<span class="hint">Drag on the image to draw a box, then tick the ones that are a correct answer. You can draw more than one correct box.</span>'));
    var stage=el('<div class="hs-editor"><img alt=""><div class="hs-draw"></div></div>');
    var img=stage.querySelector("img"); img.src=q.image;
    var drawLayer=stage.querySelector(".hs-draw");
    box.appendChild(stage);
    var rm=el('<button class="btn small danger" type="button" style="justify-self:start">Remove image</button>');
    box.appendChild(rm);
    rm.addEventListener("click",function(){ q.image=null; q.zones=[]; touched(); draw(); });
    var listBox=el('<div class="opts" style="display:grid;gap:8px"></div>');
    box.appendChild(listBox);

    function renderZones(){
      drawLayer.querySelectorAll(".hs-zone").forEach(function(z){ z.remove(); });
      listBox.innerHTML="";
      q.zones.forEach(function(z,zi){
        var mark=el('<div class="hs-zone'+(z.correct?' correct':'')+'"></div>');
        mark.style.left=z.x+"%"; mark.style.top=z.y+"%"; mark.style.width=z.w+"%"; mark.style.height=z.h+"%";
        drawLayer.appendChild(mark);
        var row=el('<div class="opt" style="grid-template-columns:auto 1fr auto"><input type="checkbox" aria-label="Correct answer"><span>Box '+(zi+1)+'</span><button class="btn small ghost" type="button" aria-label="Remove box">✕</button></div>');
        var chk=row.children[0], x=row.children[2];
        chk.checked=!!z.correct;
        chk.addEventListener("change",function(){ z.correct=chk.checked; touched(); renderZones(); });
        x.addEventListener("click",function(){ q.zones.splice(zi,1); touched(); renderZones(); });
        listBox.appendChild(row);
      });
      if(!q.zones.length) listBox.appendChild(el('<div class="hint">No boxes yet - drag on the image above to draw one.</div>'));
    }
    renderZones();

    drawLayer.addEventListener("pointerdown",function(e){
      if(e.target.closest(".hs-zone")) return;
      var r=drawLayer.getBoundingClientRect();
      var startX=(e.clientX-r.left)/r.width*100, startY=(e.clientY-r.top)/r.height*100;
      var liveBox=el('<div class="hs-zone drawing"></div>'); drawLayer.appendChild(liveBox);
      var last={x:startX,y:startY,w:0,h:0};
      function onMove(ev){
        var cx=(ev.clientX-r.left)/r.width*100, cy=(ev.clientY-r.top)/r.height*100;
        var x=Math.max(0,Math.min(startX,cx)), y=Math.max(0,Math.min(startY,cy));
        var w=Math.min(100-x,Math.abs(cx-startX)), h=Math.min(100-y,Math.abs(cy-startY));
        last={x:x,y:y,w:w,h:h};
        liveBox.style.left=x+"%"; liveBox.style.top=y+"%"; liveBox.style.width=w+"%"; liveBox.style.height=h+"%";
      }
      function onUp(){
        document.removeEventListener("pointermove",onMove); document.removeEventListener("pointerup",onUp);
        liveBox.remove();
        if(last.w>1.5 && last.h>1.5){ q.zones.push({x:last.x,y:last.y,w:last.w,h:last.h,correct:q.zones.length===0}); touched(); renderZones(); }
      }
      document.addEventListener("pointermove",onMove);
      document.addEventListener("pointerup",onUp,{once:true});
    });
  }
  draw();
  return box;
}

/* ---------- validation ---------- */
function problems(){
  var out=[];
  if(!state.title.trim()) out.push("Give the course a title (Settings).");
  if(!state.pages.length) out.push("Add at least one page.");
  state.pages.forEach(function(p,i){
    if(!p.heading.trim() && !(p.blocks||[]).length) out.push("Page "+(i+1)+" is empty.");
    videoBlocksOf(p).forEach(function(b){ if(b.video.kind==="file" && !videoStore[b.video.key]) out.push("Page "+(i+1)+": re-attach the video file \""+b.video.name+"\"."); });
  });
  function checkQ(q,label){
    if(!q.q.trim()) out.push(label+" has no question text.");
    var type=q.type||"mc";
    if(type==="match"){
      var pairs=(q.pairs||[]).filter(function(p){ return p.left.trim() && p.right.trim(); });
      if(pairs.length<2) out.push(label+" needs at least two complete pairs.");
    } else if(type==="fill"){
      var n=fillBlankCount(q.text);
      if(!n) out.push(label+" has no blanks (use ___ in the text to mark one).");
      else if((q.answers||[]).some(function(a){ return !String(a||"").trim(); })) out.push(label+": every blank needs an accepted answer.");
    } else if(type==="hotspot"){
      if(!q.image) out.push(label+" has no image.");
      else if(!(q.zones||[]).length) out.push(label+" has no boxes drawn on the image.");
      else if(!(q.zones||[]).some(function(z){ return z.correct; })) out.push(label+": mark at least one box as a correct answer.");
    } else {
      var filled=q.options.filter(function(o){ return o.trim(); }).length;
      if(filled<2) out.push(label+" needs at least two answers.");
      if(!q.options[q.correct] || !q.options[q.correct].trim()) out.push(label+": the answer marked correct is blank.");
    }
  }
  var pageIds=state.pages.map(function(p){ return p.id; });
  state.pages.forEach(function(p,i){
    if(!p.check || !p.check.on) return;
    if(!p.check.questions.length) out.push("Page "+(i+1)+": the knowledge check is switched on but has no questions.");
    p.check.questions.forEach(function(q,qi){ checkQ(q,"Page "+(i+1)+" knowledge check, question "+(qi+1)); });
    var br=p.check.branch;
    if(br && br.pass && pageIds.indexOf(br.pass)<0) out.push("Page "+(i+1)+": the \"if passed\" page no longer exists.");
    if(br && br.fail && pageIds.indexOf(br.fail)<0) out.push("Page "+(i+1)+": the \"if not passed\" page no longer exists.");
  });
  state.quiz.forEach(function(q,i){ checkQ(q,"Quiz question "+(i+1)); });
  return out;
}

function courseData(imageMap, videoMap, assetMap, hotspotMap){
  return {
    preview: !imageMap,
    title:state.title, description:state.description, author:state.author, scorm:state.scorm,
    passMark:state.passMark, accent:state.design.accent, showAnswers:state.showAnswers, allowRetry:state.allowRetry, shuffle:state.shuffle, showBadge:state.showBadge!==false,
    design: designData(assetMap),
    pages:state.pages.map(function(p,i){
      var br=p.check&&p.check.branch;
      var chk = (p.check && p.check.on && p.check.questions.length) ? {mustPass:p.check.mustPass!==false, questions:p.check.questions.map(function(q){ return cleanQ(q,hotspotMap); }), branch:{pass:(br&&br.pass)||null, fail:(br&&br.fail)||null}} : null;
      var blocks=(p.blocks||[]).map(function(b){
        if(b.type==="image") return {type:"image", image: b.image ? (imageMap?imageMap[b.id]:b.image) : null, imageAlt:b.imageAlt||"", imagePos:b.imagePos||"standard"};
        if(b.type==="video") return {type:"video", video: videoData(b, videoMap)};

        if(b.type==="keypoint") return {type:"keypoint", text:b.text||"", tone:b.tone||"brand"};
        return {type:"text", body:b.body||""};
      });
      return {id:p.id, heading:p.heading, blocks:blocks, check:chk};
    }),
    quiz:state.quiz.map(function(q){ return cleanQ(q,hotspotMap); })
  };
}
function cleanQ(q, hotspotMap){
  var type=q.type||"mc";
  if(type==="match"){
    var pairs=(q.pairs||[]).filter(function(p){ return p.left.trim() && p.right.trim(); }).map(function(p){ return {left:p.left, right:p.right}; });
    return {type:"match", q:q.q, pairs:pairs, feedback:q.feedback||""};
  }
  if(type==="fill"){
    return {type:"fill", q:q.q, text:q.text||"", answers:(q.answers||[]).map(function(a){ return String(a||""); }), feedback:q.feedback||""};
  }
  if(type==="hotspot"){
    var img = q.image ? (hotspotMap ? hotspotMap[q.id] : q.image) : null;
    return {type:"hotspot", q:q.q, image:img, imageAlt:q.imageAlt||"",

  }

var PLAYER_JS = String(function(){
